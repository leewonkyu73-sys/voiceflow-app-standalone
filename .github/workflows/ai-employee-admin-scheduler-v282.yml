name: AI Employee Admin Scheduler v282
on:
  pull_request:
    paths:
      - 'scripts/patch-ai-employee-scheduler-v282.mjs'
      - 'public/ai-employee-admin.html'
      - 'public/ai-employee-scheduler.js'
      - '.github/workflows/ai-employee-admin-scheduler-v282.yml'
jobs:
  focused-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Syntax
        run: |
          node --check scripts/patch-ai-employee-scheduler-v282.mjs
          node --check public/ai-employee-scheduler.js
      - name: Patch backend and verify admin-only schedule contracts
        run: |
          node scripts/patch-ai-employee-scheduler-v282.mjs
          node --check services/ai-employee-service.mjs
          grep -q "'/api/v1/ai-employee-schedules'" services/ai-employee-service.mjs
          grep -q "admin_required" services/ai-employee-service.mjs
          grep -q "runEmployeeSchedule" services/ai-employee-service.mjs
          grep -q "approval_required" services/ai-employee-service.mjs
          grep -q "ai-employee-scheduler.js?v=2.8.2" public/ai-employee-admin.html
          grep -q "지금 실행" public/ai-employee-scheduler.js
          grep -q "중지" public/ai-employee-scheduler.js
          grep -q "최근 실행" public/ai-employee-scheduler.js
