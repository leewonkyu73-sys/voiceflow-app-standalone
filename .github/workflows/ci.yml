name: VoiceFlow CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '.codex/**'
  pull_request:
  workflow_dispatch:
    inputs:
      run_browser_e2e:
        description: 'GitHub 호스티드 러너에서 브라우저 E2E 실행'
        required: false
        type: boolean
        default: false
      run_vps_docker:
        description: '운영 VPS에서 수동 Docker 검증 실행'
        required: false
        type: boolean
        default: false
      deploy_production:
        description: 'Docker 검증 후 전체 운영 배포'
        required: false
        type: boolean
        default: false

concurrency:
  group: voiceflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-whisper-assets:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[model-assets]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-local-whisper-assets.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node --check server-v2.mjs
      - run: node --check frontend-v4/packages/mobile-caption-session/index.mjs
      - run: node --check frontend-v4/packages/mobile-media-session/index.mjs
      - run: node --check frontend-v4/packages/mobile-speech-session/index.mjs
      - run: node --check frontend-v4/packages/mobile-browser-speech-session/index.mjs
      - run: node --check frontend-v4/packages/mobile-input-policy/index.mjs
      - run: node --check frontend-v4/packages/mobile-local-whisper/index.mjs
      - run: node --check frontend-v4/apps/mobile-pwa/app.mjs
      - run: node --check frontend-v4/apps/mobile-local-stt-test/app.mjs
      - run: node --check frontend-v4/apps/mobile-local-stt-test/local-whisper-worker.mjs
      - run: node --check frontend-v4/apps/mobile-local-stt-test/local-sw.js
      - run: node --check scripts/verify-live-stt-provider.mjs
      - run: node --check services/admin-integration-service.mjs
      - run: node --check services/integration-hub-bridge-service.mjs
      - run: node --check services/integration-env-launcher.mjs
      - run: node --check services/board-service.mjs
      - run: node --check services/meeting-result-drive-service.mjs
      - run: node --check services/task-calendar-service.mjs
