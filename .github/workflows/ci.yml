          grep -Fq 'node scripts/patch-admin-drive-v262.mjs' deploy/skill-distribution-control.sh
          grep -Fq 'SKILL_HEALTH_ATTEMPTS:-30' deploy/skill-distribution-control.sh
          grep -Fq 'wait_status || fail' deploy/skill-distribution-control.sh
          grep -Fq '[verify-skill-distribution-e2e]' .github/workflows/skill-distribution-ops.yml
          grep -Fq 'sh deploy/skill-distribution-e2e.sh' .github/workflows/skill-distribution-ops.yml
          grep -Fq 'EXPECTED_APPROVED_SHA' deploy/skill-distribution-e2e.sh
      - name: Validate WebRTC relay contract
        run: |
          grep -q 'function rtcConfig' server-v2.mjs
          grep -q "ROOM_CORE_VERSION='v345-caption-revision-sync'" server-v2.mjs
