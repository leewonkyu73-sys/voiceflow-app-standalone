      - name: Validate production deploy serialization
        run: |
          node --input-type=module -e "import fs from 'node:fs';const ci=fs.readFileSync('.github/workflows/ci.yml','utf8'),nfc=fs.readFileSync('.github/workflows/deploy-nfc-admin-v1.yml','utf8'),job=ci.split('\\n  deploy-production:\\n')[1]||'';if(!job.includes('\\n    concurrency:\\n      group: voiceflow-production-rollout\\n      cancel-in-progress: false\\n'))process.exit(1);if(!nfc.includes('\\nconcurrency:\\n  group: voiceflow-production-rollout\\n  cancel-in-progress: false\\n'))process.exit(1)"
      - run: sh -n deploy/skill-distribution-control.sh
      - run: sh -n deploy/skill-distribution-e2e.sh
      - name: Validate skill distribution operating workflow
        run: |
          grep -Fq 'cancel-in-progress: false' .github/workflows/skill-distribution-ops.yml
          grep -Fq 'skill-distribution/operating' .github/workflows/skill-distribution-ops.yml
          grep -Fq 'sh deploy/skill-distribution-control.sh enable' .github/workflows/skill-distribution-ops.yml
