          grep -q 'voiceflow-subpage-shell.css' public/board.html
          grep -q 'voiceflow-subpage-shell.js' public/board.html
          grep -q 'voiceflow-subpage-shell.css' public/work-calendar.html
          grep -q 'voiceflow-subpage-shell.js' public/work-calendar.html
          grep -q "\['work','account'\].includes(requestedView)" public/app.js


  prepare-ui-artifact:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-ui]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate guarded UI artifact
        run: |
          node scripts/patch-admin-drive-v262.mjs
          node --check public/app.js
          grep -q "const APP_VERSION='3.5.24'" public/app.js
          grep -q "'x-voice-client':'v4-mobile'" public/app.js
          grep -q 'state._serverSttTimer=setTimeout(cycle,nextDelay)' public/app.js
          tar -C public -czf "$RUNNER_TEMP/voiceflow-ui.tar.gz" app.js index.html sw.js
          cp deploy/publish-ui-artifact-v330.sh "$RUNNER_TEMP/publish-ui-artifact-v330.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: voiceflow-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/voiceflow-ui.tar.gz
            ${{ runner.temp }}/publish-ui-artifact-v330.sh
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  deploy-ui:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-ui]')
    needs: [test, prepare-ui-artifact]
    concurrency:
      group: voiceflow-production-rollout
      cancel-in-progress: false
    runs-on: [self-hosted, voiceflow, vps]
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voiceflow-ui-${{ github.sha }}
          path: ${{ runner.temp }}/voiceflow-ui-${{ github.run_id }}
      - name: Publish prebuilt UI with VPS load guard
        run: |
          sh "${RUNNER_TEMP}/voiceflow-ui-${GITHUB_RUN_ID}/publish-ui-artifact-v330.sh" "${RUNNER_TEMP}/voiceflow-ui-${GITHUB_RUN_ID}/voiceflow-ui.tar.gz"

  verify-public-ui:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-ui]')
    needs: deploy-ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public UI from hosted runner
        run: |
          attempt=1
          while [ "$attempt" -le 12 ]; do
            stamp=$(date +%s)
            index=$(curl -fsSL --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://voice.star45.net/?ts=$stamp" || true)
            app=$(curl -fsSL --connect-timeout 5 --max-time 10 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://voice.star45.net/app.js?ts=$stamp" || true)
            if printf '%s' "$index" | grep -qF 'app.js?v=3.5.24' && printf '%s' "$app" | grep -qF "const APP_VERSION='3.5.24'"; then
              echo 'PUBLIC UI PASS: v3.5.24'
              exit 0
            fi
            echo "Public UI not ready from hosted runner; attempt=$attempt/12"
            attempt=$((attempt+1))
            sleep 5
          done
          echo 'PUBLIC UI FAIL: v3.5.24 not externally reachable'
          exit 1

  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.run_vps_docker == true
    needs: test
    concurrency:
      group: voiceflow-production-rollout
      cancel-in-progress: false
    runs-on: [self-hosted, voiceflow, vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: docker/setup-buildx-action@v3
      - name: Prepare exact frontend artifact
        run: |
          node scripts/patch-admin-drive-v262.mjs
          node --check public/app.js
          node scripts/verify-ui-bindings-v261.mjs
          grep -q '음성메모를 시작하세요' public/app.js
          grep -q 'interimResults=true' public/app.js
      - name: Validate local STT compose command contract
        run: |
          COMPOSE_PROFILES=local-stt docker compose -f deploy/docker-compose.v23.yml config --format json | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{const d=JSON.parse(s),cmd=d.services?.['voiceflow-local-stt']?.command,required=['download-ggml-model.sh tiny /models','download-vad-model.sh silero-v6.2.0 /models','--vad-model /models/ggml-silero-v6.2.0.bin'];if(!Array.isArray(cmd)||cmd.length!==1||required.some(token=>!cmd[0].includes(token)))process.exit(1)})"
      - name: Verify local STT Silero VAD runtime
        run: sh tests/local-stt-vad-runtime.sh
      - run: docker build -f deploy/Dockerfile.v2 -t voiceflow-smart-workspace:v2.6 .

  browser-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_browser_e2e == true
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare exact frontend artifact
        run: |
          node scripts/patch-admin-drive-v262.mjs
          node --check public/app.js
          node scripts/verify-ui-bindings-v261.mjs
          grep -q '음성메모를 시작하세요' public/app.js
          grep -q 'interimResults=true' public/app.js
      - name: Build production image
        run: docker build -f deploy/Dockerfile.v2 -t voiceflow-smart-workspace:v2.6 .
      - name: Prepare E2E environment
        run: |
          sudo mkdir -p /opt/star45/voiceflow-data /opt/star45/voiceflow-runtime-public /opt/star45/obsidian-vault /opt/star45/hermes-bridge
          sudo chmod -R 777 /opt/star45/voiceflow-data /opt/star45/voiceflow-runtime-public /opt/star45/obsidian-vault /opt/star45/hermes-bridge
          cp -R public/. /opt/star45/voiceflow-runtime-public/
          cat > .env <<'EOF'
          NODE_ENV=production
          INTEGRATION_SECRET_KEY=e2e-central-integration-secret-key-262
          MEETING_PUBLIC_BASE_URL=http://127.0.0.1:4173
          OBSIDIAN_HOST_PATH=/opt/star45/obsidian-vault
          OBSIDIAN_VAULT_PATH=/vault
          HERMES_ENABLED=false
          HERMES_HOST_BRIDGE_DIR=/opt/star45/hermes-bridge
          HERMES_BRIDGE_DIR=/hermes-bridge
          AUTOMATION_POLL_MS=3000
          VOICEFLOW_V4_LOCAL_STT_ENABLED=1
          EOF
      - name: Start full stack
        run: |
          docker compose --env-file .env -f deploy/docker-compose.v23.yml up -d --force-recreate
          sleep 12
          docker compose --env-file .env -f deploy/docker-compose.v23.yml ps
      - name: Service QA
        run: sh deploy/qa-v23.sh
      - name: Hub bridge health
        run: curl -fsSL http://127.0.0.1:4182/health | grep -q 'integration-hub-bridge'
      - name: Browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_EXPECT_VERSION: 2.6.2
          E2E_WRITE_SAMPLE: 1
        run: node tests/e2e-meeting.mjs
      - name: Local STT PWA browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_WRITE_SAMPLE: 1
        run: node tests/e2e-v4-local-stt.mjs
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.v23.yml logs --no-color --tail=300
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.v23.yml down --remove-orphans

  local-stt-browser-e2e:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_browser_e2e == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[browser-e2e]'))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated local-STT PWA server
        run: |
          mkdir -p "$RUNNER_TEMP/voiceflow-local-stt-data"
          PORT=4173 DATA_DIR="$RUNNER_TEMP/voiceflow-local-stt-data" VOICEFLOW_V4_MOBILE_ENABLED=1 VOICEFLOW_V4_LOCAL_STT_ENABLED=1 node server-v2.mjs >"$RUNNER_TEMP/voiceflow-local-stt-server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/voiceflow-local-stt-server.pid"
          attempt=0
          until curl -fsS http://127.0.0.1:4173/api/health >/dev/null; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 40 ]; then
              cat "$RUNNER_TEMP/voiceflow-local-stt-server.log"
              exit 1
            fi
            sleep 1
          done
      - name: Local STT PWA browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_WRITE_SAMPLE: 1
        run: node tests/e2e-v4-local-stt.mjs
      - name: Dump candidate server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/voiceflow-local-stt-server.log"
      - name: Stop isolated candidate server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/voiceflow-local-stt-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/voiceflow-local-stt-server.pid")" 2>/dev/null || true
          fi

  speech-quality-browser-e2e:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_browser_e2e == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[speech-quality-e2e]'))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated speech quality lab
        run: |
          mkdir -p "$RUNNER_TEMP/voiceflow-speech-quality-data"
          PORT=4173 DATA_DIR="$RUNNER_TEMP/voiceflow-speech-quality-data" VOICEFLOW_SPEECH_QUALITY_LAB_ENABLED=1 VOICEFLOW_SPEECH_QUALITY_API_ENABLED=0 node server-v2.mjs >"$RUNNER_TEMP/voiceflow-speech-quality-server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/voiceflow-speech-quality-server.pid"
          attempt=0
          until curl -fsS http://127.0.0.1:4173/api/health >/dev/null; do
            attempt=$((attempt+1))
            if [ "$attempt" -ge 40 ]; then
              cat "$RUNNER_TEMP/voiceflow-speech-quality-server.log"
              exit 1
            fi
            sleep 1
          done
      - name: Speech quality PWA browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: node tests/e2e-speech-quality-lab.mjs
      - name: Dump candidate server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/voiceflow-speech-quality-server.log"
      - name: Stop isolated speech quality lab
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/voiceflow-speech-quality-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/voiceflow-speech-quality-server.pid")" 2>/dev/null || true
          fi


  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.run_vps_docker == true && inputs.deploy_production == true
    needs: docker
    concurrency:
      group: voiceflow-production-rollout
      cancel-in-progress: false
    runs-on: [self-hosted, voiceflow, vps]
    timeout-minutes: 30
    env:
      VOICEFLOW_V4_MOBILE_ENABLED: ${{ (contains(github.event.head_commit.message, '[v4-mobile-canary]') || contains(github.event.head_commit.message, '[speech-quality-lab]')) && '1' || '0' }}
      VOICEFLOW_V4_LOCAL_STT_ENABLED: ${{ contains(github.event.head_commit.message, '[local-stt-pwa-canary]') && '1' || '0' }}
      VOICEFLOW_SPEECH_QUALITY_LAB_ENABLED: ${{ contains(github.event.head_commit.message, '[speech-quality-lab]') && '1' || '0' }}
      VOICEFLOW_SPEECH_QUALITY_API_ENABLED: '0'
      VOICEFLOW_V4_MOBILE_SERVER_STT_REQUIRED: ${{ contains(github.event.head_commit.message, '[v4-mobile-server-stt]') && '1' || '0' }}
      LOCAL_STT_ENABLED: ${{ contains(github.event.head_commit.message, '[local-stt-canary]') && '1' || '0' }}
      COMPOSE_PROFILES: ${{ contains(github.event.head_commit.message, '[local-stt-canary]') && 'local-stt' || '' }}
    steps:
      - name: Sync production checkout
        run: |
          cd /opt/star45/voiceflow-smart-workspace
          git fetch origin main
          git reset --hard origin/main
      - name: Deploy and verify production
        run: |
          cd /opt/star45/voiceflow-smart-workspace
          VOICEFLOW_DEPLOY_REFRESHED=1 sh deploy/complete-to-100-v262.sh
