name: Auto Clone Standalone App (A안)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  clone-standalone:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Auto Clone to voiceflow-app-standalone
        run: |
          set -e
          cd /opt/star45
          rm -rf voiceflow-app-standalone
          cp -r voiceflow-smart-workspace voiceflow-app-standalone
          cd voiceflow-app-standalone
          rm -rf .git node_modules
          sed -i 's/"name": "voiceflow-smart-workspace"/"name": "voiceflow-app-standalone"/' package.json
          sed -i 's/3005/3006/g' server-v2.mjs || true
          mkdir -p data
          echo "{\"stt_tokens\":0,\"stt_seconds\":0}" > data/usage.json
          npm install --silent
          pm2 delete voiceflow-standalone 2>/dev/null || true
          PORT=3006 pm2 start server-v2.mjs --name voiceflow-standalone
          pm2 save
          sleep 5
          pm2 list
          curl -s http://127.0.0.1:3006/api/health || echo "booting..."
