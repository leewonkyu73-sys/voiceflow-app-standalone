name: VoiceFlow WebRTC TURN v343

on:
  workflow_dispatch:

concurrency:
  group: voiceflow-webrtc-turn-live
  cancel-in-progress: false

jobs:
  deploy-turn:
    runs-on: [self-hosted, voiceflow, vps]
    timeout-minutes: 15
    steps:
      - name: Verify protected workspace
        run: |
          test -d /opt/star45/voiceflow-smart-workspace/.git
          test -d /opt/star45/voiceflow-data
      - name: Sync approved main revision
        run: |
          cd /opt/star45/voiceflow-smart-workspace
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Install and verify TURN relay
        run: |
          cd /opt/star45/voiceflow-smart-workspace
          sh deploy/deploy-webrtc-turn-v343.sh
