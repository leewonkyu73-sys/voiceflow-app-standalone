name: Diagnose Voice UI canonical versus fallback

on:
  push:
    branches:
      - ops/voice-readonly-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect UI runtimes without changes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 5m
          script_stop: false
          script: |
            echo "=== TIME_CAPACITY ==="
            date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
            uptime
            free -m
            df -h /

            echo "=== ACTIVE_EDGE ==="
            pm2 list || true
            pm2 describe voice 2>/dev/null | grep -E 'status|script path|exec cwd|interpreter|restarts|uptime' || true
            ss -ltnp | grep -E ':(80|443|3005|3006|4173|4174|4175|4176|4180|4181)([[:space:]]|$)' || true
            nginx -t 2>&1 || true
            sed -n '1,120p' /etc/nginx/sites-enabled/voice.star45.net 2>/dev/null || true

            echo "=== DOCKER_STATUS ==="
            docker ps -a --format 'NAME={{.Names}} STATUS={{.Status}} PORTS={{.Ports}} IMAGE={{.Image}}' | grep -E 'voiceflow|NAME=' || true
            for c in voiceflow-core-v26 voiceflow-public-edge-v262 voiceflow-ai-v26 voiceflow-admin-integrations-v26; do
              if docker inspect "$c" >/dev/null 2>&1; then
                echo "CONTAINER=$c STATE=$(docker inspect --format '{{.State.Status}}' "$c") RESTARTS=$(docker inspect --format '{{.RestartCount}}' "$c")"
                docker inspect --format '{{range .Mounts}}MOUNT={{.Source}} -> {{.Destination}} RW={{.RW}}{{println}}{{end}}' "$c" 2>/dev/null || true
              else
                echo "CONTAINER=$c MISSING"
              fi
            done

            echo "=== WORKSPACE_STATE ==="
            for d in /opt/star45/voiceflow-smart-workspace /opt/star45/voiceflow-runtime-public /opt/star45/voiceflow-app-standalone /opt/star45/do-app; do
              if [ -e "$d" ]; then
                echo "PATH=$d"
                if [ -d "$d/.git" ]; then
                  (cd "$d" && echo "HEAD=$(git rev-parse HEAD 2>/dev/null || true)" && echo "BRANCH=$(git branch --show-current 2>/dev/null || true)" && git status --short | head -40) || true
                fi
                for f in public/index.html public/app.js public/sw.js index.html app.js sw.js; do
                  [ -f "$d/$f" ] && sha256sum "$d/$f"
                done
              fi
            done

            echo "=== UI_MARKERS_BY_ARTIFACT ==="
            for f in /opt/star45/voiceflow-smart-workspace/public/app.js /opt/star45/voiceflow-runtime-public/app.js /opt/star45/voiceflow-app-standalone/public/app.js /opt/star45/do-app/public/app.js; do
              if [ -f "$f" ]; then
                echo "FILE=$f BYTES=$(wc -c < "$f")"
                for marker in 'liveComposer' 'mobileFourControls' '/v4/mobile' 'v4/mobile' 'model download' '모델 다운로드' 'data-translation-input' 'bottom-nav' '회의 시작' '의장 모드' '상담 모드'; do
                  count=$(grep -Foc "$marker" "$f" 2>/dev/null || true)
                  echo "MARKER=$marker COUNT=$count"
                done
              fi
            done

            echo "=== INDEX_MARKERS ==="
            for f in /opt/star45/voiceflow-smart-workspace/public/index.html /opt/star45/voiceflow-runtime-public/index.html /opt/star45/voiceflow-app-standalone/public/index.html /opt/star45/do-app/public/index.html; do
              if [ -f "$f" ]; then
                echo "FILE=$f"
                grep -oE 'app\.js[^"< ]*|frontend-v4[^"< ]*|voiceflow[^"< ]*\.js[^"< ]*' "$f" | tail -20 || true
              fi
            done

            echo "=== ENDPOINT_COMPARISON ==="
            for url in http://127.0.0.1:3005/ http://127.0.0.1:3005/v4/mobile http://127.0.0.1:3006/ http://127.0.0.1:4180/ http://127.0.0.1:4180/v4/mobile; do
              safe=$(printf '%s' "$url" | tr '/:' '__')
              code=$(curl -sS --max-time 8 -o "/tmp/$safe" -w '%{http_code}' "$url" || true)
              bytes=$(wc -c < "/tmp/$safe" 2>/dev/null || echo 0)
              title=$(grep -o '<title>[^<]*' "/tmp/$safe" 2>/dev/null | head -1 | sed 's/<title>//' || true)
              echo "URL=$url CODE=$code BYTES=$bytes TITLE=$title"
              rm -f "/tmp/$safe"
            done
            for path in / /v4/mobile /app.js /api/health; do
              safe=$(printf '%s' "$path" | tr '/' '_')
              code=$(curl -sS --max-time 10 -H 'Cache-Control: no-cache' -o "/tmp/public$safe" -w '%{http_code}' "https://voice.star45.net$path?ts=$(date +%s)" || true)
              bytes=$(wc -c < "/tmp/public$safe" 2>/dev/null || echo 0)
              title=$(grep -o '<title>[^<]*' "/tmp/public$safe" 2>/dev/null | head -1 | sed 's/<title>//' || true)
              echo "PUBLIC_PATH=$path CODE=$code BYTES=$bytes TITLE=$title"
              rm -f "/tmp/public$safe"
            done

            echo "=== BACKUP_AND_DEPLOY_FILES ==="
            find /opt/star45 -maxdepth 3 -type d \( -iname '*backup*' -o -iname '*rollback*' -o -iname '*runtime-public*' \) -print 2>/dev/null | head -80
            ls -la /opt/star45/voiceflow-smart-workspace/deploy 2>/dev/null | head -80 || true
            echo "=== DIAGNOSTIC_COMPLETE ==="

      - name: Verify current public response from independent runner
        shell: bash
        run: |
          set -euo pipefail
          for path in / /v4/mobile /app.js /api/health; do
            code=$(curl -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/voice-check -w '%{http_code}' "https://voice.star45.net$path?ts=$(date +%s)") || code=000
            bytes=$(wc -c < /tmp/voice-check 2>/dev/null || echo 0)
            title=$(grep -o '<title>[^<]*' /tmp/voice-check 2>/dev/null | head -1 | sed 's/<title>//' || true)
            echo "EXTERNAL_PATH=$path CODE=$code BYTES=$bytes TITLE=$title"
            rm -f /tmp/voice-check
          done
