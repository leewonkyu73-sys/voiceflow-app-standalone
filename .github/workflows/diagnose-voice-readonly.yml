name: Diagnose voice.star45.net DNS read-only

on:
  push:
    branches:
      - ops/voice-readonly-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DNS and endpoint without changes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 5m
          script_stop: false
          script: |
            echo "=== TIME ==="
            date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'

            echo "=== HOSTS_OVERRIDE ==="
            grep -nE 'voice\.star45\.net|star45\.net' /etc/hosts || echo "NO_HOSTS_OVERRIDE"

            echo "=== RESOLVER_CONFIG ==="
            sed -n '1,80p' /etc/resolv.conf

            echo "=== SYSTEM_RESOLUTION ==="
            getent ahostsv4 voice.star45.net || true
            getent ahostsv6 voice.star45.net || true

            echo "=== PUBLIC_RESOLVER_TOOLS ==="
            if command -v dig >/dev/null 2>&1; then
              echo "CLOUDFLARE_A"
              dig +time=5 +tries=1 +short A voice.star45.net @1.1.1.1 || true
              echo "GOOGLE_A"
              dig +time=5 +tries=1 +short A voice.star45.net @8.8.8.8 || true
              echo "CLOUDFLARE_NS"
              dig +time=5 +tries=1 +short NS star45.net @1.1.1.1 || true
              echo "CLOUDFLARE_SOA"
              dig +time=5 +tries=1 +short SOA star45.net @1.1.1.1 || true
            else
              echo "DIG_NOT_INSTALLED"
            fi
            if command -v host >/dev/null 2>&1; then host voice.star45.net 1.1.1.1 || true; fi
            if command -v nslookup >/dev/null 2>&1; then nslookup voice.star45.net 8.8.8.8 || true; fi

            echo "=== CURRENT_RUNTIME ==="
            pm2 list || true
            ss -ltnp | grep -E ':(80|443|3005|3006)([[:space:]]|$)' || true
            grep -RInE 'server_name[^;]*voice\.star45\.net|proxy_pass[[:space:]]+http://127\.0\.0\.1:(3005|3006)' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true

            echo "=== HTTPS_CHECKS ==="
            curl -k -sS --max-time 10 --resolve voice.star45.net:443:127.0.0.1 -o /tmp/voice-local -w 'LOCAL_HTTPS CODE=%{http_code} SIZE=%{size_download} TIME=%{time_total}\n' https://voice.star45.net/ || true
            curl -sS --max-time 12 -o /tmp/voice-public -w 'PUBLIC_HTTPS CODE=%{http_code} REMOTE=%{remote_ip} SIZE=%{size_download} TIME=%{time_total} SSL=%{ssl_verify_result}\n' https://voice.star45.net/ || true
            rm -f /tmp/voice-local /tmp/voice-public

            echo "=== DNS_DIAGNOSTIC_COMPLETE ==="
