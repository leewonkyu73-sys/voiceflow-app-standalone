name: Diagnose local Whisper inference through VPS SSH

on:
  push:
    branches:
      - ops/voice-stt-translation-diagnostic
    paths:
      - .github/workflows/diagnose-voice-stt-translation.yml

permissions:
  contents: read

concurrency:
  group: voice-local-whisper-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Execute isolated local Whisper inference diagnostic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 8m
          script_stop: false
          script: |
            set -euo pipefail
            ROOT=/opt/star45/voiceflow-smart-workspace
            SCRIPT=/tmp/diagnose-local-whisper-${{ github.run_id }}.sh
            trap 'rm -f "$SCRIPT"' EXIT
            git -C "$ROOT" -c safe.directory="$ROOT" fetch --quiet origin 84bfa3d63370e4015f0aa6663f27d53711743a4b
            git -C "$ROOT" -c safe.directory="$ROOT" show 84bfa3d63370e4015f0aa6663f27d53711743a4b:ops/diagnose-local-whisper-inference.sh > "$SCRIPT"
            chmod 700 "$SCRIPT"
            RUN_KEY=${{ github.run_id }} bash "$SCRIPT"
