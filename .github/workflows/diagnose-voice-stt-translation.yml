name: Restore Voice edge after retired v269 interference

on:
  push:
    branches:
      - ops/voice-stt-translation-diagnostic
    paths:
      - .github/workflows/diagnose-voice-stt-translation.yml

permissions:
  contents: read

concurrency:
  group: voice-edge-emergency-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Remove legacy proxy and restore system Nginx full-core route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            RUN_ID='${{ github.run_id }}'
            CONF=/etc/nginx/sites-enabled/voice.star45.net
            BACKUP=/opt/star45/quarantine/voice-edge-post-v269-$RUN_ID
            mkdir -p "$BACKUP"
            chmod 700 "$BACKUP"
            cp -a "$CONF" "$BACKUP/voice.star45.net.before"
            docker inspect voiceflow-proxy > "$BACKUP/voiceflow-proxy.inspect.json" 2>/dev/null || true
            docker logs --tail 100 voiceflow-proxy > "$BACKUP/voiceflow-proxy.log" 2>&1 || true

            echo '=== CURRENT_STATE ==='
            docker ps -a --format 'NAME={{.Names}} STATUS={{.Status}} PORTS={{.Ports}}' | grep -E 'voiceflow-proxy|NAME=' || true
            ss -ltnp | grep -E ':(80|443|3005|3006|4186|4190)([[:space:]]|$)' || true
            PM2_HOME=/root/.pm2 pm2 list || true
            grep -A8 -F 'location ^~ /api/' "$CONF" || true

            echo '=== REMOVE_LEGACY_EDGE ==='
            docker rm -f voiceflow-proxy voiceflow-emergency-proxy >/dev/null 2>&1 || true
            pkill -9 -f '/opt/voiceflow-proxy' 2>/dev/null || true
            sleep 1

            echo '=== ENSURE_FULL_CORE_ROUTE ==='
            test -f "$CONF"
            if grep -A8 -F 'location ^~ /api/' "$CONF" | grep -qF 'proxy_pass http://127.0.0.1:3005;'; then
              sed -i '/location \^~ \/api\//,/^[[:space:]]*}/ s#proxy_pass http://127.0.0.1:3005;#proxy_pass http://127.0.0.1:4190;#' "$CONF"
            fi
            grep -A8 -F 'location ^~ /api/' "$CONF" | grep -qF 'proxy_pass http://127.0.0.1:4190;'
            PM2_HOME=/root/.pm2 pm2 describe voice-core-full | grep -q 'online'
            test "$(curl -sS --max-time 8 -o /tmp/full-health-$RUN_ID.json -w '%{http_code}' http://127.0.0.1:4190/api/health)" = 200
            node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!d.ok||d.service!=='voiceflow'||d.version!=='2.0.0')process.exit(1)" /tmp/full-health-$RUN_ID.json
            rm -f /tmp/full-health-$RUN_ID.json

            echo '=== RESTORE_SYSTEM_NGINX ==='
            nginx -t
            systemctl restart nginx
            ready=0
            for n in $(seq 1 20); do
              if curl -k -fsSL --max-time 4 --resolve voice.star45.net:443:127.0.0.1 https://voice.star45.net/api/health >/tmp/public-health-$RUN_ID.json 2>/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
            node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!d.ok||d.service!=='voiceflow'||d.version!=='2.0.0')process.exit(1)" /tmp/public-health-$RUN_ID.json
            rm -f /tmp/public-health-$RUN_ID.json
            ss -ltnp | grep -E '0\.0\.0\.0:(80|443)' | grep -q nginx
            test "$(sha256sum /opt/star45/voiceflow-runtime-public/app.js | awk '{print $1}')" = ce08604d3b31af087bd9054768e44e38291b584a27434872aa346e35c2f4ec04
            test "$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:3006/api/health)" = 200
            printf 'status=PASS\nlegacy_proxy=removed\nnginx=systemd\napi_upstream=127.0.0.1:4190\nrollback_config=%s\n' "$BACKUP/voice.star45.net.before" > "$BACKUP/README.txt"
            echo 'LEGACY_V269_PROXY=REMOVED'
            echo 'SYSTEM_NGINX=RESTORED'
            echo 'FULL_CORE_ROUTE_4190=PASS'
            echo 'LOCAL_VERIFICATION=PASS'
            echo "BACKUP=$BACKUP"

      - name: Verify externally after edge restoration
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID='${{ github.run_id }}'
          INDEX=/tmp/index-$RUN_ID
          APP=/tmp/app-$RUN_ID
          HEALTH=/tmp/health-$RUN_ID
          trap 'rm -f "$INDEX" "$APP" "$HEALTH"' EXIT
          ROOT_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o "$INDEX" -w '%{http_code}' "https://voice.star45.net/?ts=$RUN_ID")
          APP_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o "$APP" -w '%{http_code}' "https://voice.star45.net/app.js?ts=$RUN_ID")
          HEALTH_CODE=$(curl -sS --connect-timeout 10 --max-time 20 -o "$HEALTH" -w '%{http_code}' https://voice.star45.net/api/health)
          test "$ROOT_CODE" = 200
          test "$APP_CODE" = 200
          test "$HEALTH_CODE" = 200
          test "$(sha256sum "$APP" | awk '{print $1}')" = ce08604d3b31af087bd9054768e44e38291b584a27434872aa346e35c2f4ec04
          node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!d.ok||d.service!=='voiceflow'||d.version!=='2.0.0')process.exit(1)" "$HEALTH"
          for port in 3005 3006 4186 4190; do
            code=$(curl -sS --connect-timeout 4 --max-time 6 -o /dev/null -w '%{http_code}' "http://187.127.216.242:$port/") || code=000
            test "$code" = 000
          done
          echo 'EXTERNAL_EDGE_RESTORATION=PASS'
          echo "ROOT=$ROOT_CODE APP=$APP_CODE API=$HEALTH_CODE"
