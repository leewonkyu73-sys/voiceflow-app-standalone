name: Restore local Whisper sidecar through VPS SSH

on:
  push:
    branches:
      - ops/voice-stt-translation-diagnostic
    paths:
      - .github/workflows/diagnose-voice-stt-translation.yml

permissions:
  contents: read

concurrency:
  group: voice-local-whisper-production
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Execute guarded sidecar restoration on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            ROOT=/opt/star45/voiceflow-smart-workspace
            SCRIPT=/tmp/restore-local-whisper-${{ github.run_id }}.sh
            trap 'rm -f "$SCRIPT"' EXIT
            git -C "$ROOT" -c safe.directory="$ROOT" fetch --quiet origin d2426754c7514a1afcbf8fb00937816c434c4bdf
            git -C "$ROOT" -c safe.directory="$ROOT" show d2426754c7514a1afcbf8fb00937816c434c4bdf:ops/restore-local-whisper-sidecar.sh > "$SCRIPT"
            sed -i 's/-v load="/-v load1="/; s/load <= cores/load1 <= cores/' "$SCRIPT"
            chmod 700 "$SCRIPT"
            RUN_KEY=${{ github.run_id }} bash "$SCRIPT"
