name: Restore Voice core after runner child cleanup

on:
  push:
    branches:
      - ops/voice-stt-translation-diagnostic
    paths:
      - .github/workflows/diagnose-voice-stt-translation.yml

permissions:
  contents: read

concurrency:
  group: voice-core-emergency-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Restore previous Voice core through independent SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 8m
          script_stop: true
          script: |
            set -euo pipefail
            ROOT=/opt/star45/voiceflow-smart-workspace
            RUNTIME=/opt/star45/voiceflow-runtime-public
            FAILED_RUN=33910249191
            BACKUP=/opt/star45/quarantine/voice-mobile-safety-$FAILED_RUN
            CONF=/etc/nginx/sites-enabled/voice.star45.net
            PM2_HOME=/root/.pm2

            echo '=== CURRENT_STATE ==='
            date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
            uptime
            PM2_HOME="$PM2_HOME" pm2 list || true
            ss -ltnp | grep -E ':(80|443|3005|3006|4186|4190)([[:space:]]|$)' || true
            curl -sS --max-time 5 http://127.0.0.1:4190/api/health || true
            echo

            echo '=== RESTORE_KNOWN_GOOD_FILES ==='
            test -d "$BACKUP"
            for f in app.js index.html sw.js; do
              test -f "$BACKUP/runtime-$f"
              test -f "$BACKUP/source-$f"
              install -m 644 "$BACKUP/runtime-$f" "$RUNTIME/$f"
              install -m 644 "$BACKUP/source-$f" "$ROOT/public/$f"
            done
            test -f "$BACKUP/server-v2.mjs"
            install -m 644 "$BACKUP/server-v2.mjs" "$ROOT/server-v2.mjs"
            node --check "$ROOT/server-v2.mjs"
            node --check "$RUNTIME/app.js"

            echo '=== START_FULL_CORE_OUTSIDE_RUNNER_TRACKING ==='
            if PM2_HOME="$PM2_HOME" pm2 describe voice-core-full >/dev/null 2>&1; then
              PM2_HOME="$PM2_HOME" pm2 restart voice-core-full --update-env
            else
              test -x /opt/star45/runtime/voice-core-full/start.sh
              PM2_HOME="$PM2_HOME" pm2 start /opt/star45/runtime/voice-core-full/start.sh --name voice-core-full
            fi
            ready=0
            for n in $(seq 1 40); do
              if curl -fsSL --max-time 3 http://127.0.0.1:4190/api/health >/tmp/voice-restore-health.json 2>/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
            node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/voice-restore-health.json','utf8'));if(!d.ok||d.service!=='voiceflow'||d.version!=='2.0.0')process.exit(1)"
            rm -f /tmp/voice-restore-health.json

            echo '=== RESTORE_EDGE_AND_PERSIST ==='
            test -f "$CONF"
            if grep -A8 -F 'location ^~ /api/' "$CONF" | grep -qF 'proxy_pass http://127.0.0.1:3005;'; then
              sed -i '/location \^~ \/api\//,/^[[:space:]]*}/ s#proxy_pass http://127.0.0.1:3005;#proxy_pass http://127.0.0.1:4190;#' "$CONF"
            fi
            grep -A8 -F 'location ^~ /api/' "$CONF" | grep -qF 'proxy_pass http://127.0.0.1:4190;'
            nginx -t
            systemctl restart nginx
            PM2_HOME="$PM2_HOME" pm2 save
            sleep 2

            echo '=== LOCAL_REGRESSION ==='
            test "$(curl -sS --max-time 10 -o /tmp/voice-public-health.json -w '%{http_code}' https://voice.star45.net/api/health)" = 200
            node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/voice-public-health.json','utf8'));if(!d.ok||d.service!=='voiceflow'||d.version!=='2.0.0')process.exit(1)"
            rm -f /tmp/voice-public-health.json
            test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://voice.star45.net/)" = 200
            test "$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:3005/api/health)" = 200
            test "$(curl -sS --max-time 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:3006/api/health)" = 200
            test "$(docker inspect --format '{{.State.Status}}' voiceflow-local-stt)" = running
            PM2_HOME="$PM2_HOME" pm2 describe voice-core-full | grep -q 'online'
            grep -q 'voice-core-full' "$PM2_HOME/dump.pm2"
            echo 'VOICE_CORE_RESTORED=PASS'
            echo 'KNOWN_GOOD_FILES_RESTORED=PASS'
            echo 'PUBLIC_API=PASS'

      - name: Verify restored Voice independently
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://voice.star45.net
          test "$(curl -sS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/root -w '%{http_code}' "$BASE/?restore=${{ github.run_id }}")" = 200
          test "$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/health -w '%{http_code}' "$BASE/api/health")" = 200
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/health','utf8'));if(!d.ok||d.service!=='voiceflow'||d.version!=='2.0.0')process.exit(1)"
          for port in 3005 3006 4186 4190; do
            code=$(curl -sS --connect-timeout 4 --max-time 6 -o /dev/null -w '%{http_code}' "http://187.127.216.242:$port/") || code=000
            echo "DIRECT_PORT_$port=$code"
            test "$code" = 000
          done
          rm -f /tmp/root /tmp/health
          echo 'INDEPENDENT_RESTORE_VERIFICATION=PASS'
