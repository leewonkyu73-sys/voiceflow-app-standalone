name: DOITAI Import Auth Identities

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.github/workflows/doitai-import-auth-identities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 90s
          script_stop: false
          command_timeout: 7m
          script: |
            set -eu
            BRIDGE=/tmp/doitai-migration-bridge
            CODE=/tmp/doitai-code
            BRANCH=probe/doitai-vps-access-20260914
            CODE_BRANCH=vps-direct-migration-20260914
            APP=/opt/star45/doitai
            PG=star45-core-postgres
            DB=star45_doitai
            ENC=$BRIDGE/.doitai-migration/auth-identities.pgp.b64
            BIN=/tmp/doitai-auth-identities.pgp
            JSON=/tmp/doitai-auth-identities.json
            GNUPGHOME=/opt/star45/secrets/doitai-migration-gnupg
            export GNUPGHOME
            cleanup() { chmod 600 "$JSON" 2>/dev/null || true; rm -f "$BIN" "$JSON"; rm -rf "$BRIDGE" "$CODE"; }
            trap cleanup EXIT

            rm -rf "$BRIDGE" "$CODE"
            git clone --depth=1 --branch "$BRANCH" git@github.com:leewonkyu73-sys/voiceflow-app-standalone.git "$BRIDGE" >/dev/null 2>&1
            git clone --depth=1 --branch "$CODE_BRANCH" git@github.com:leewonkyu73-sys/doitai.git "$CODE" >/dev/null 2>&1
            test -s "$ENC"
            test -f "$CODE/server/tools/import-auth-identities.mjs"

            PGU=$(docker exec "$PG" sh -lc 'printf %s "${POSTGRES_USER:-postgres}"')
            auth_before=$(docker exec "$PG" psql -U "$PGU" -d "$DB" -Atc 'select count(*) from auth.users;')
            teams_before=$(docker exec "$PG" psql -U "$PGU" -d "$DB" -Atc 'select count(*) from public.teams;')
            test "$auth_before" = 0
            test "$teams_before" = 0

            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            mkdir -p "$APP/backups"
            docker exec "$PG" pg_dump -U "$PGU" -Fc "$DB" > "$APP/backups/pre-auth-identities-${stamp}.dump"
            test -s "$APP/backups/pre-auth-identities-${stamp}.dump"
            echo DOITAI_PRE_AUTH_BACKUP_PASS

            tr -d '[:space:]' < "$ENC" | base64 -d > "$BIN"
            gpg --batch --quiet --decrypt "$BIN" > "$JSON"
            chmod 644 "$JSON"
            docker run --rm --network star45-core-private \
              --env-file /opt/star45/secrets/doitai-migration.env \
              -v "$CODE/server/tools:/app/server/tools:ro" \
              -v "$JSON:/payload.json:ro" \
              star45-doitai:vps-direct \
              node /app/server/tools/import-auth-identities.mjs /payload.json
            chmod 600 "$JSON"

            auth_after=$(docker exec "$PG" psql -U "$PGU" -d "$DB" -Atc 'select count(*) from auth.users;')
            test "$auth_after" = 9
            echo DOITAI_AUTH_IDENTITIES_COUNT_PASS
            echo DOITAI_AUTH_IDENTITIES_IMPORT_PASS
