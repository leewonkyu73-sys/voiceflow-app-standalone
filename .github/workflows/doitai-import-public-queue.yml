name: DOITAI Import Verified Public Queue

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.doitai-migration/queue-ready'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doitai-public-queue-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 90s
          script_stop: true
          command_timeout: 12m
          script: |
            set -eu
            BRIDGE=/tmp/doitai-migration-queue
            CODE=/tmp/doitai-code-queue
            APP=/opt/star45/doitai
            PG=star45-core-postgres
            DB=star45_doitai
            BIN=/tmp/doitai-public-queue.pgp
            JSON=/tmp/doitai-public-queue.json
            GNUPGHOME=/opt/star45/secrets/doitai-migration-gnupg
            export GNUPGHOME
            cleanup() { chmod 600 "$JSON" 2>/dev/null || true; rm -f "$BIN" "$JSON"; rm -rf "$BRIDGE" "$CODE"; }
            trap cleanup EXIT

            git clone --depth=1 --branch probe/doitai-vps-access-20260914 git@github.com:leewonkyu73-sys/voiceflow-app-standalone.git "$BRIDGE" >/dev/null 2>&1
            git -C "$BRIDGE" fetch --depth=1 origin ${{ github.sha }} >/dev/null 2>&1
            git -C "$BRIDGE" checkout --detach ${{ github.sha }} >/dev/null 2>&1
            git clone --depth=1 --branch vps-direct-migration-20260914 git@github.com:leewonkyu73-sys/doitai.git "$CODE" >/dev/null 2>&1

            COUNT=$(find "$BRIDGE/.doitai-migration/queue" -maxdepth 1 -type f -name '*.pgp.b64' | wc -l | tr -d '[:space:]')
            test "$COUNT" -ge 1
            echo "DOITAI_PUBLIC_QUEUE_FILES_PASS count=$COUNT"

            PGU=$(docker exec "$PG" sh -lc 'printf %s "${POSTGRES_USER:-postgres}"')
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            mkdir -p "$APP/backups"
            docker exec "$PG" pg_dump -U "$PGU" -Fc "$DB" > "$APP/backups/pre-public-queue-${stamp}.dump"
            test -s "$APP/backups/pre-public-queue-${stamp}.dump"
            echo DOITAI_PRE_PUBLIC_QUEUE_BACKUP_PASS

            for SRC in $(find "$BRIDGE/.doitai-migration/queue" -maxdepth 1 -type f -name '*.pgp.b64' | sort); do
              LABEL=$(basename "$SRC")
              tr -d '[:space:]' < "$SRC" | base64 -d > "$BIN"
              gpg --batch --quiet --decrypt "$BIN" > "$JSON"
              chmod 644 "$JSON"
              docker run --rm --network star45-core-private \
                --env-file /opt/star45/secrets/doitai-migration.env \
                -v "$CODE/server/tools:/app/server/tools:ro" \
                -v "$JSON:/payload.json:ro" \
                star45-doitai:vps-direct \
                node /app/server/tools/import-public-data.mjs /payload.json
              chmod 600 "$JSON"
              echo "DOITAI_PUBLIC_QUEUE_IMPORT_PASS file=$LABEL"
            done

            check_count() { T="$1"; E="$2"; A=$(docker exec "$PG" psql -U "$PGU" -d "$DB" -At -c "select count(*) from public.$T"); test "$A" -eq "$E"; echo "DOITAI_COUNT_PASS table=$T rows=$A"; }
            check_count board_posts 41
            check_count board_admins 5
            check_count board_comments 16
            check_count cash_ledger_entries 439
            check_count consult_sessions 8
            check_count content_category_files 1
            check_count data_structure_prompts 12
            check_count expense_schedules 11
            check_count idea_memos 134
            check_count inventory_items 10
            check_count inventory_transactions 2
            check_count notifications 134
            check_count onboarding_configs 48
            check_count schedules 231
            check_count schedule_checklists 33
            check_count schedule_checklist_categories 73
            check_count schedule_checklist_items 212
            check_count schedule_translations 1065
            check_count secretary_monitors 8
            check_count secretary_reports 6
            check_count settlements 2
            check_count team_messages 2
            check_count web_sites 1
            echo DOITAI_REMAINING_PUBLIC_DATA_COMPLETE
