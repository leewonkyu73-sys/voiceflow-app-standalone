name: DOITAI Source Export Prep

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.github/workflows/doitai-source-export-prep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 90s
          script_stop: false
          command_timeout: 6m
          script: |
            set -eu
            SEC=/opt/star45/secrets
            GNUPGHOME=$SEC/doitai-migration-gnupg
            PUB=$SEC/doitai-migration-public.asc
            UID='DOITAI Migration <doitai-migration@star45.local>'
            mkdir -p "$SEC" "$GNUPGHOME"
            chmod 700 "$SEC" "$GNUPGHOME"
            export GNUPGHOME
            command -v gpg >/dev/null
            if ! gpg --batch --list-secret-keys "$UID" >/dev/null 2>&1; then
              gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key "$UID" rsa3072 cert 1d
              FPR=$(gpg --batch --with-colons --list-secret-keys "$UID" | awk -F: '/^fpr:/ {print $10; exit}')
              test -n "$FPR"
              gpg --batch --pinentry-mode loopback --passphrase '' --quick-add-key "$FPR" rsa3072 encr 1d
            fi
            FPR=$(gpg --batch --with-colons --list-secret-keys "$UID" | awk -F: '/^fpr:/ {print $10; exit}')
            gpg --batch --armor --export "$UID" > "$PUB"
            chmod 644 "$PUB"
            test -s "$PUB"
            echo "DOITAI_MIGRATION_GPG_FINGERPRINT=$FPR"
            echo 'DOITAI_MIGRATION_PUBLIC_KEY_BEGIN'
            cat "$PUB"
            echo 'DOITAI_MIGRATION_PUBLIC_KEY_END'
            echo DOITAI_SOURCE_EXPORT_PREP_PASS
