name: DOITAI Target Hash Probe

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.github/workflows/doitai-target-hash-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 90s
          script_stop: false
          command_timeout: 6m
          script: |
            set -eu
            PG=star45-core-postgres
            DB=star45_doitai
            PGU=$(docker exec "$PG" sh -lc 'printf %s "${POSTGRES_USER:-postgres}"')
            echo DOITAI_TARGET_FULL_COUNT_BEGIN
            docker exec "$PG" psql -U "$PGU" -d "$DB" -At -c "select tablename from pg_tables where schemaname='public' order by tablename" | while IFS= read -r t; do
              c=$(docker exec "$PG" psql -U "$PGU" -d "$DB" -At -c "select count(*) from public.\"$t\"")
              printf '%s|%s\n' "$t" "$c"
            done
            echo DOITAI_TARGET_FULL_COUNT_END
            echo DOITAI_TARGET_HASH_PROBE_PASS
