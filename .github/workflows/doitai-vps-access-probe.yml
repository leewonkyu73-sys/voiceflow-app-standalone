name: DOITAI VPS Access Probe

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.github/workflows/doitai-vps-access-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: false
          timeout: 90s
          script: |
            set -eu
            echo DOITAI_BRIDGE_SSH_PASS
            echo '=== VPS GITHUB ACCESS PROBE ==='
            GIT_TERMINAL_PROMPT=0 git ls-remote git@github.com:leewonkyu73-sys/doitai.git HEAD >/dev/null 2>&1 && echo DOITAI_GIT_SSH_ACCESS_PASS
            GIT_TERMINAL_PROMPT=0 git ls-remote git@github.com:leewonkyu73-sys/voiceflow-app-standalone.git HEAD >/dev/null 2>&1 && echo DOITAI_BRIDGE_REPO_SSH_ACCESS_PASS
            echo '=== RUNTIME ==='
            docker version --format 'server={{.Server.Version}}'
            docker ps --filter name=star45-doitai --format 'name={{.Names}} status={{.Status}} ports={{.Ports}}'
