name: DOITAI VPS Preview Deploy

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.github/workflows/doitai-vps-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 90s
          script_stop: false
          command_timeout: 20m
          script: |
            set -eu
            APP_DIR=/opt/star45/doitai
            REPO=git@github.com:leewonkyu73-sys/doitai.git
            BRANCH=vps-direct-migration-20260914
            EXPECTED=e6d2474ccbc3f7285f4f6a82146956afd2a0eb52
            PG=star45-core-postgres
            NET=star45-core-private

            echo '=== DOITAI PREVIEW BASELINE ==='
            docker network inspect "$NET" >/dev/null 2>&1 || { echo 'BASELINE_NETWORK_FAIL'; exit 31; }
            echo 'BASELINE_NETWORK_PASS'
            docker inspect "$PG" >/dev/null 2>&1 || { echo 'BASELINE_POSTGRES_CONTAINER_FAIL'; exit 32; }
            echo 'BASELINE_POSTGRES_CONTAINER_PASS'
            docker ps --format '{{.Names}}' | grep -qx "$PG" || { echo 'BASELINE_POSTGRES_RUNNING_FAIL'; exit 33; }
            echo 'BASELINE_POSTGRES_RUNNING_PASS'
            PGU=$(docker exec "$PG" sh -lc 'printf %s "${POSTGRES_USER:-postgres}"')
            PGD=$(docker exec "$PG" sh -lc 'printf %s "${POSTGRES_DB:-postgres}"')
            docker exec "$PG" pg_isready -U "$PGU" -d "$PGD" >/dev/null 2>&1 || { echo 'BASELINE_POSTGRES_READY_FAIL'; exit 34; }
            echo 'BASELINE_POSTGRES_READY_PASS'
            port_line=$(ss -ltn 2>/dev/null | grep -E '127\.0\.0\.1:4608\b' || true)
            if [ -n "$port_line" ]; then
              owner=$(docker ps --format '{{.Names}}|{{.Ports}}' | grep -E '127\.0\.0\.1:4608->' | cut -d'|' -f1 || true)
              if [ "$owner" != star45-doitai ]; then
                echo 'BASELINE_PORT_4608_CONFLICT'
                printf '%s\n' "$port_line"
                exit 35
              fi
              echo 'BASELINE_EXISTING_DOITAI_PORT_PASS'
            else
              echo 'BASELINE_PORT_4608_FREE_PASS'
            fi

            echo '=== DOITAI SOURCE CHECKOUT ==='
            if [ -e "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              origin=$(git remote get-url origin)
              printf '%s\n' "$origin" | grep -Eq 'github\.com[:/]leewonkyu73-sys/doitai(\.git)?$' || { echo 'SOURCE_ORIGIN_FAIL'; exit 36; }
              echo 'SOURCE_ORIGIN_PASS'
              old=$(git rev-parse HEAD)
              echo "existing_repo_commit=$old"
              printf '%s\n' "$old" > /opt/star45/doitai-predeploy-commit.txt
              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git reset --hard "origin/$BRANCH"
            elif [ -e "$APP_DIR" ] && [ "$(find "$APP_DIR" -mindepth 1 -maxdepth 1 2>/dev/null | wc -l)" -gt 0 ]; then
              echo 'SOURCE_EXISTING_NON_GIT_DIR_FAIL'
              find "$APP_DIR" -mindepth 1 -maxdepth 1 -printf '%f\n' | head -n 40
              exit 37
            else
              mkdir -p /opt/star45
              rm -rf "$APP_DIR"
              git clone --branch "$BRANCH" --single-branch "$REPO" "$APP_DIR"
              cd "$APP_DIR"
            fi

            actual=$(git rev-parse HEAD)
            echo "checked_out_commit=$actual"
            [ "$actual" = "$EXPECTED" ] || { echo 'SOURCE_COMMIT_FAIL'; exit 38; }
            echo 'SOURCE_COMMIT_PASS'

            echo '=== RUN DIRECT VPS DEPLOY ==='
            sh scripts/vps-direct-deploy.sh

            echo '=== VERIFY PREVIEW ==='
            curl -fsS http://127.0.0.1:4608/health
            docker ps --filter name=star45-doitai --format 'name={{.Names}} status={{.Status}} ports={{.Ports}}'
            docker exec "$PG" sh -lc 'U=${POSTGRES_USER:-postgres}; D=${POSTGRES_DB:-postgres}; psql -U "$U" -d "$D" -Atc "select datname from pg_database where datname='"'"'star45_doitai'"'"';"'
            echo DOITAI_GITHUB_TO_VPS_PREVIEW_PASS
