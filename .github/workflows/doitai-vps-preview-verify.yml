name: DOITAI VPS Preview Verify

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.github/workflows/doitai-vps-preview-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 90s
          script_stop: false
          command_timeout: 4m
          script: |
            set -u
            C=star45-doitai
            echo '=== NETWORK FLAGS ==='
            docker network inspect star45-core-private -f 'core_internal={{.Internal}} core_driver={{.Driver}}' 2>/dev/null || true
            docker network inspect star45-network -f 'shared_internal={{.Internal}} shared_driver={{.Driver}}' 2>/dev/null || true
            echo '=== COMPARISON NETWORKS ==='
            for c in star45-doitai star45-platform-admin star45-schedule star45-finance-api; do
              docker inspect "$c" -f 'name={{.Name}} networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}} ports={{json .NetworkSettings.Ports}}' 2>/dev/null || true
            done
            echo '=== DOITAI INTERNAL HEALTH ==='
            docker exec "$C" sh -lc 'node -e "fetch(\"http://127.0.0.1:4608/health\").then(async r=>{const j=await r.json(); console.log(JSON.stringify({status:r.status,ok:j.ok,database:j.database,supabase:j.supabase,deploymentCenter:j.deploymentCenter,remoteDesktop:j.remoteDesktop,db:j.db}))}).catch(e=>{console.error(String(e));process.exit(1)})"' 2>/dev/null || true
            echo '=== HOST PORT ==='
            ss -ltn 2>/dev/null | grep -E ':4608\b' || true
            echo DOITAI_PREVIEW_VERIFY_SAFE_DONE
