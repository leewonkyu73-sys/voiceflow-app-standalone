name: DOITAI VPS Preview Verify

on:
  push:
    branches: [probe/doitai-vps-access-20260914]
    paths:
      - '.github/workflows/doitai-vps-preview-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 90s
          script_stop: false
          command_timeout: 4m
          script: |
            set -eu
            C=star45-doitai
            EXPECTED=90bcf6887e96aab403e2d65d4114a8a5f603d8d4
            echo '=== SOURCE ==='
            cd /opt/star45/doitai
            test "$(git rev-parse HEAD)" = "$EXPECTED"
            echo DOITAI_SOURCE_COMMIT_PASS
            echo '=== NETWORK FLAGS ==='
            docker network inspect star45-core-private -f 'core_internal={{.Internal}} core_driver={{.Driver}}' 2>/dev/null
            docker network inspect star45-network -f 'shared_internal={{.Internal}} shared_driver={{.Driver}}' 2>/dev/null
            docker inspect "$C" -f 'name={{.Name}} networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}} ports={{json .NetworkSettings.Ports}}'
            echo '=== HOST HEALTH ==='
            curl -fsS http://127.0.0.1:4608/health >/tmp/doitai-safe-health.json
            grep -q '"ok":true' /tmp/doitai-safe-health.json
            grep -q '"database":"postgresql"' /tmp/doitai-safe-health.json
            grep -q '"supabase":false' /tmp/doitai-safe-health.json
            echo DOITAI_HOST_HEALTH_PASS
            echo '=== APP SHELL ==='
            curl -fsS http://127.0.0.1:4608/ >/tmp/doitai-safe-root.html
            grep -qi '<div id="root"' /tmp/doitai-safe-root.html
            echo DOITAI_APP_SHELL_PASS
            echo '=== HOST PORT ==='
            ss -ltn | grep -E '127\.0\.0\.1:4608\b'
            ! ss -ltn | grep -Eq '0\.0\.0\.0:4608|\[::\]:4608'
            echo DOITAI_PREVIEW_VERIFY_SAFE_PASS
