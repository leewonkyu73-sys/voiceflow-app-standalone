name: Fix 502 do.ab80.net
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /opt/star45/voiceflow-app-standalone
            echo "=== PM2 상태 ==="
            pm2 list
            pm2 logs do --lines 50 --nostream || true
            echo "=== 3006 포트 확인 ==="
            ss -tlnp | grep 3006 || echo "3006 NOT LISTENING"
            curl -v http://127.0.0.1:3006/do 2>&1 | head -30 || echo "curl failed"
            
            echo "=== 빌드 에러 수정 - do 페이지 자체 완결 버전으로 교체 ==="
            cat > app/do/page.tsx <<'TSX'
            'use client';
            import { useState, useRef } from 'react';
            export default function DoPage() {
              const [recording, setRecording] = useState(false);
              const [audioBlob, setAudioBlob] = useState<Blob|null>(null);
              const [text, setText] = useState(''); const [translated, setTranslated] = useState('');
              const mediaRef = useRef<MediaRecorder|null>(null);
              const chunks = useRef<Blob[]>([]);
              const start = async () => {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                chunks.current = []; const mr = new MediaRecorder(stream); mediaRef.current = mr;
                mr.ondataavailable = e => chunks.current.push(e.data);
                mr.onstop = () => { setAudioBlob(new Blob(chunks.current, {type:'audio/webm'})); stream.getTracks().forEach(t=>t.stop()); };
                mr.start(); setRecording(true);
              };
              const stop = () => { mediaRef.current?.stop(); setRecording(false); };
              const handleTranscribe = async () => {
                if(!audioBlob) return; const fd = new FormData(); fd.append('audio', audioBlob, 'rec.webm');
                const r = await fetch('/api/do/transcribe', {method:'POST', body:fd}); const j = await r.json(); setText(j.text);
              };
              const handleTranslate = async (t: string) => {
                const r = await fetch('/api/do/translate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, target:t})}); const j = await r.json(); setTranslated(j.translated);
              };
              return (
                <div style={{padding:32, maxWidth:720, margin:'0 auto', fontFamily:'sans-serif'}}>
                  <h1 style={{fontSize:32, fontWeight:800}}>DO - 녹음 → 텍스트 → 번역</h1>
                  <div style={{marginTop:8, color:'#666'}}>do.ab80.net | PM2: do :3006</div>
                  <button onClick={recording?stop:start} style={{marginTop:24, padding:'16px 32px', background: recording?'#ef4444':'#000', color:'#fff', borderRadius:12, fontSize:18, border:'none', cursor:'pointer'}}>
                    {recording ? '● 녹음 중지' : '● 녹음 시작'}
                  </button>
                  {audioBlob && <button onClick={handleTranscribe} style={{marginLeft:12, padding:'16px 24px', border:'1px solid #000', borderRadius:12, cursor:'pointer'}}>텍스트 변환</button>}
                  {text && <div style={{marginTop:24, padding:16, background:'#f5f5f5', borderRadius:12}}><b>원문:</b> {text}<div style={{marginTop:12}}><button onClick={()=>handleTranslate('en')} style={{marginRight:8}}>영어로</button><button onClick={()=>handleTranslate('vi')}>베트남어로</button></div></div>}
                  {translated && <div style={{marginTop:16, padding:16, background:'#000', color:'#fff', borderRadius:12}}><b>번역:</b> {translated}</div>}
                </div>
              );
            }
            TSX
            
            echo "=== 재빌드 & 재시작 ==="
            npm run build || true
            pm2 restart do || pm2 start npm --name do -- start -- --port 3006
            pm2 save
            sleep 3
            pm2 list
            curl -I http://127.0.0.1:3006/do || true
            
            echo "=== Nginx do.ab80.net 체크 & 재생성 ==="
            cat /etc/nginx/sites-enabled/do.ab80.net || echo "no config"
            cat > /etc/nginx/sites-available/do.ab80.net <<'NGINX'
            server {
                listen 80;
                server_name do.ab80.net;
                location / {
                    proxy_pass http://127.0.0.1:3006;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX
            ln -sf /etc/nginx/sites-available/do.ab80.net /etc/nginx/sites-enabled/do.ab80.net
            nginx -t && systemctl reload nginx
            echo "=== FIX DONE ==="
