name: Fix 502 do.ab80.net
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: false
          script: |
            set -x
            echo "=== Fix do.ab80.net -> 3006 ==="
            cat > /etc/nginx/sites-available/do.ab80.net <<'EOF'
            server {
              listen 80;
              server_name do.ab80.net;
              location / {
                proxy_pass http://127.0.0.1:3006;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
            EOF
            ln -sf /etc/nginx/sites-available/do.ab80.net /etc/nginx/sites-enabled/do.ab80.net
            rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
            pm2 list
            pm2 restart do --update-env || (cd /root/voiceflow-app-standalone 2>/dev/null || cd ~/voiceflow-app-standalone; PORT=3006 pm2 start npm --name do -- start)
            nginx -t && systemctl reload nginx
            sleep 2
            curl -I http://127.0.0.1:3006 || true
            curl -I http://do.ab80.net || true
            echo "DONE"
