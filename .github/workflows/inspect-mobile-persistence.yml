name: Trace periodic Voice source reversion

on:
  push:
    branches:
      - ops/voice-stt-translation-diagnostic
    paths:
      - .github/workflows/inspect-mobile-persistence.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect timers, services and file timestamps without changes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 7m
          script_stop: false
          script: |
            set -u
            ROOT=/opt/star45/voiceflow-smart-workspace
            RUNTIME=/opt/star45/voiceflow-runtime-public
            echo '=== TIME_HEALTH ==='
            date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
            uptime
            curl -sS --max-time 8 https://voice.star45.net/api/health || true
            echo
            echo '=== FILE_STATE ==='
            for f in "$ROOT/server-v2.mjs" "$ROOT/public/app.js" "$ROOT/public/index.html" "$ROOT/public/sw.js" "$RUNTIME/app.js" "$RUNTIME/index.html" "$RUNTIME/sw.js"; do
              if [ -f "$f" ]; then
                stat -c 'FILE=%n MTIME=%y SIZE=%s INODE=%i' "$f"
                sha256sum "$f"
                echo "MOBILE_GATE=$(grep -Foc 'audio_below_speech_floor' "$f" 2>/dev/null || true) ANDROID_FIX=$(grep -Foc 'if(mobileSpeech&&!mobileBrowserSpeech)' "$f" 2>/dev/null || true)"
              fi
            done
            echo '=== GIT_STATE ==='
            git -C "$ROOT" -c safe.directory="$ROOT" rev-parse HEAD 2>/dev/null || true
            git -C "$ROOT" -c safe.directory="$ROOT" status --short | head -120 || true
            git -C "$ROOT" -c safe.directory="$ROOT" reflog --date=iso -20 2>/dev/null || true
            echo '=== SYSTEMD_TIMERS ==='
            systemctl list-timers --all --no-pager 2>/dev/null | head -120 || true
            echo '=== RELEVANT_RUNNING_SERVICES ==='
            systemctl list-units --type=service --state=running --no-pager 2>/dev/null | grep -Ei 'star45|voice|deploy|runner|watch|sync|git|webhook|agent' || true
            echo '=== RELEVANT_UNIT_FILES ==='
            grep -RIlE '/opt/star45/voiceflow-smart-workspace|git (pull|reset|checkout|restore)|voiceflow-runtime-public' /etc/systemd/system /lib/systemd/system 2>/dev/null | head -100 || true
            for f in $(grep -RIlE '/opt/star45/voiceflow-smart-workspace|git (pull|reset|checkout|restore)|voiceflow-runtime-public' /etc/systemd/system /lib/systemd/system 2>/dev/null | head -40); do
              echo "UNIT_FILE=$f"
              sed -n '1,220p' "$f"
            done
            echo '=== CRON ==='
            crontab -l 2>/dev/null || true
            sed -n '1,200p' /etc/crontab 2>/dev/null || true
            grep -RInE 'voiceflow|/opt/star45|git (pull|reset|checkout|restore)|deploy' /etc/cron.d /etc/cron.hourly /etc/cron.daily 2>/dev/null | head -160 || true
            echo '=== PROCESSES ==='
            ps -eo pid,ppid,lstart,etimes,cmd --sort=pid | grep -Ei 'actions-runner|Runner.Listener|Runner.Worker|voiceflow|deployment|watch|sync|git (pull|reset|checkout|restore)|webhook' | grep -v grep | head -200 || true
            echo '=== DOCKER ==='
            docker ps --format 'NAME={{.Names}} IMAGE={{.Image}} STATUS={{.Status}}' | grep -Ei 'voice|deploy|watch|sync|webhook|NAME=' || true
            for c in $(docker ps --format '{{.Names}}' | grep -Ei 'voice|deploy|watch|sync|webhook' | head -30); do
              echo "CONTAINER=$c"
              docker inspect "$c" --format '{{range .Mounts}}MOUNT={{.Source}} -> {{.Destination}} RW={{.RW}}{{println}}{{end}}' 2>/dev/null || true
            done
            echo '=== RECENT_JOURNAL ==='
            journalctl --since '2026-09-04 19:15:00 UTC' --no-pager 2>/dev/null | grep -Ei 'voiceflow|git|deploy|runner|checkout|reset|restore|sync' | tail -240 || true
            echo '=== RUNNER_LOG_TAILS ==='
            find /opt/star45 -path '*/_diag/*.log' -type f -mmin -30 -print 2>/dev/null | tail -20 | while read -r f; do echo "LOG=$f"; tail -n 80 "$f"; done
            echo 'TRACE_COMPLETE=YES'
