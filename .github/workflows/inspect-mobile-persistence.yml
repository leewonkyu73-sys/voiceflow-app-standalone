name: Inspect legacy Voice cron scripts before isolation

on:
  push:
    branches:
      - ops/voice-stt-translation-diagnostic
    paths:
      - .github/workflows/inspect-mobile-persistence.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect targeted cron scripts without changes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 5m
          script_stop: false
          script: |
            set -u
            echo '=== TIME_HEALTH ==='
            date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
            curl -sS --max-time 8 https://voice.star45.net/api/health || true
            echo
            echo '=== ROOT_CRONTAB ==='
            crontab -l 2>/dev/null || true
            echo '=== SYSTEM_CRONTAB ==='
            sed -n '1,220p' /etc/crontab 2>/dev/null || true
            echo '=== TARGET_SCRIPTS ==='
            for f in /usr/local/bin/voiceflow-auto-deploy.sh /opt/voiceflow-proxy/fix.sh; do
              echo "FILE=$f"
              if [ -f "$f" ]; then
                stat -c 'MODE=%a OWNER=%U:%G MTIME=%y SIZE=%s SHA=' "$f"
                sha256sum "$f"
                sed -n '1,260p' "$f"
              else
                echo 'MISSING'
              fi
            done
            echo '=== AGENT_UNITS ==='
            for f in /etc/systemd/system/star45-agent.service /etc/systemd/system/star45-agent.timer; do
              echo "FILE=$f"
              [ -f "$f" ] && sed -n '1,220p' "$f" || echo MISSING
            done
            echo '=== PROXY_STATE ==='
            docker ps -a --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}} PORTS={{.Ports}}' | grep -E 'voiceflow-proxy|NAME=' || true
            docker inspect voiceflow-proxy --format '{{json .HostConfig.RestartPolicy}} {{json .NetworkSettings.Networks}}' 2>/dev/null || true
            echo '=== RECENT_SCRIPT_REFERENCES ==='
            grep -RInF '/usr/local/bin/voiceflow-auto-deploy.sh' /etc /opt/star45 2>/dev/null | head -100 || true
            grep -RInF '/opt/voiceflow-proxy/fix.sh' /etc /opt/star45 2>/dev/null | head -100 || true
            echo '=== CURRENT_FILE_MARKERS ==='
            for f in /opt/star45/voiceflow-smart-workspace/server-v2.mjs /opt/star45/voiceflow-smart-workspace/public/app.js /opt/star45/voiceflow-runtime-public/app.js; do
              echo "FILE=$f SHA=$(sha256sum "$f" | awk '{print $1}') GATE=$(grep -Foc 'audio_below_speech_floor' "$f" 2>/dev/null || true) ANDROID=$(grep -Foc 'if(mobileSpeech&&!mobileBrowserSpeech)' "$f" 2>/dev/null || true)"
            done
            echo 'INSPECTION_COMPLETE=YES'
