name: Meeting Collaboration v280

on:
  pull_request:
    paths:
      - 'public/meeting-collab.js'
      - 'public/meeting-collab.css'
      - 'public/index.html'
      - '.github/workflows/meeting-collab-v280.yml'

concurrency:
  group: meeting-collab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-collab-check:
    runs-on: [self-hosted, voiceflow, vps]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: node --check public/meeting-collab.js
      - name: Verify meeting invite NFC AI mission contracts
        run: |
          grep -q '/api/v1/tapjoin/activate' public/meeting-collab.js
          grep -q "'NDEFReader'in window" public/meeting-collab.js
          grep -q 'navigator.share' public/meeting-collab.js
          grep -q '/api/v1/ai-employees' public/meeting-collab.js
          grep -q '/api/v1/ai-actions/propose' public/meeting-collab.js
          grep -q 'meeting.mission' public/meeting-collab.js
          grep -q 'meetingCollabTrigger' public/meeting-collab.js
          grep -q 'data-staff-select' public/meeting-collab.js
          grep -q 'data-ai-select' public/meeting-collab.js
          grep -q 'mcInviteSelected' public/meeting-collab.js
          grep -q 'meeting-collab.js?v=2.8.2' public/index.html
          grep -q 'meeting-collab.css?v=2.8.2' public/index.html
          echo 'MEETING ROOM OPEN PASS'
          echo 'TAPJOIN INVITE PASS'
          echo 'NFC PASS'
          echo 'SHARE INVITE PASS'
          echo 'AI EMPLOYEE INVITE PASS'
          echo 'AI MISSION ASSIGN PASS'
