name: Promote to Prod Domain

on:
  workflow_dispatch:
    inputs:
      action:
        description: '배포 액션'
        required: true
        default: 'promote'
        type: choice
        options:
          - promote
          - rollback

jobs:
  switch-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Nginx Proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            NGINX_CONF=$(grep -rl "proxy_pass.*3005\|proxy_pass.*3006" /etc/nginx/ --include="*.conf" | head -1)
            if [ -z "$NGINX_CONF" ]; then
              NGINX_CONF=$(grep -rl "3005" /etc/nginx/ --include="*.conf" | head -1)
            fi
            echo "Config: $NGINX_CONF"
            cat $NGINX_CONF | grep proxy_pass
            
            if [ "${{ github.event.inputs.action }}" == "rollback" ]; then
              echo ">> 롤백: 3006 -> 3005"
              sed -i 's/3006/3005/g' $NGINX_CONF
            else
              echo ">> 승격: 3005 -> 3006 (standalone을 정식으로)"
              sed -i 's/3005/3006/g' $NGINX_CONF
            fi
            
            nginx -t && systemctl reload nginx
            echo "✅ 완료"
            grep proxy_pass $NGINX_CONF
