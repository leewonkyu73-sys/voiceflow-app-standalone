name: Setup do-app.ab80.net Domain
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.242
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cat > /etc/nginx/sites-available/do-app.ab80.net <<'NGINX'
            server {
                listen 80;
                server_name do-app.ab80.net;
                location / {
                    proxy_pass http://127.0.0.1:3006;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX
            ln -sf /etc/nginx/sites-available/do-app.ab80.net /etc/nginx/sites-enabled/do-app.ab80.net
            nginx -t && systemctl reload nginx
            pm2 list
            pm2 restart do || pm2 start npm --name do -- start -- --port 3006
            echo "do-app.ab80.net -> :3006 분리 완료, do.ab80.net(SmartSign)는 유지"
