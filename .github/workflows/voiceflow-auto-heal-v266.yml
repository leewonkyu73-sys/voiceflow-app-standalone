name: VoiceFlow Auto Heal v266 - SELF HEALING LOOP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  heal:
    runs-on: [self-hosted, voiceflow, vps]
    steps:
      - name: Ensure core online
        run: |
          cd /opt/star45/voiceflow-smart-workspace
          pm2 list | grep voiceflow-core || PORT=3005 NODE_ENV=production pm2 start server-v2.mjs --name voiceflow-core
          pm2 save || true
          curl -s http://127.0.0.1:3005/api/health | head -c 100 || true

      - name: Free 80/443 and fix traefik
        run: |
          docker stop ai-star45 star45-tvdp ai-portal 2>/dev/null || true
          mkdir -p /opt/traefik/dynamic /opt/star45/traefik/dynamic /etc/traefik/dynamic
          cat > /opt/traefik/dynamic/voiceflow.yml <<'YML'
          http:
            routers:
              voiceflow:
                rule: "Host(`voice.star45.net`)"
                entryPoints: ["websecure","web"]
                service: voiceflow
                tls:
                  certResolver: letsencrypt
              voiceflow-http:
                rule: "Host(`voice.star45.net`)"
                entryPoints: ["web"]
                service: voiceflow
            services:
              voiceflow:
                loadBalancer:
                  servers:
                    - url: "http://172.17.0.1:3005"
          YML
          cp /opt/traefik/dynamic/voiceflow.yml /opt/star45/traefik/dynamic/voiceflow.yml 2>/dev/null || true
          cp /opt/traefik/dynamic/voiceflow.yml /etc/traefik/dynamic/voiceflow.yml 2>/dev/null || true

          # Ensure file provider enabled
          if! grep -q "file:" /opt/traefik/traefik.yml 2>/dev/null; then
            echo "providers:" >> /opt/traefik/traefik.yml
            echo " docker:" >> /opt/traefik/traefik.yml
            echo " exposedByDefault: false" >> /opt/traefik/traefik.yml
            echo " file:" >> /opt/traefik/traefik.yml
            echo " directory: /etc/traefik/dynamic" >> /opt/traefik/traefik.yml
            echo " watch: true" >> /opt/traefik/traefik.yml
          fi

          docker restart traefik-traefik-1
          sleep 10
          docker logs traefik-traefik-1 --tail 100 | tail -n 50 || true

      - name: Verify and fallback if still 404
        run: |
          echo "=== First try ==="
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/\n" https://voice.star45.net/ || true
          CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://voice.star45.net/ || echo "000")
          echo "CODE=$CODE"
          if [ "$CODE"!= "200" ]; then
            echo "Still $CODE, trying fallback: direct nginx proxy on 80/443"
            docker rm -f voiceflow-temp-proxy 2>/dev/null || true
            docker run -d --name voiceflow-temp-proxy -p 80:80 -p 443:443 \
              -v /opt/traefik/dynamic/voiceflow.yml:/etc/nginx/conf.d/default.conf \
              nginx:alpine 2>&1 || true
            # Better: use socat fallback to make 80 -> 3005
            pkill socat || true
            nohup socat TCP-LISTEN:80,fork,reuseaddr TCP:127.0.0.1:3005 > /tmp/socat80.log 2>&1 &
            sleep 2
            curl -s -o /dev/null -w "%{http_code} http://voice.star45.net/\n" http://voice.star45.net/ || true
            curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/ after fallback\n" https://voice.star45.net/ || true
          fi
          echo "=== Final check ==="
          for i in 1 2 3; do curl -k -s -o /dev/null -w "%{http_code} %{url_effective}\n" https://voice.star45.net/ https://voice.star45.net/app.js?v=3.5.24 https://voice.star45.net/api/health; sleep 2; done
          curl -s http://127.0.0.1:3005/api/health || true
