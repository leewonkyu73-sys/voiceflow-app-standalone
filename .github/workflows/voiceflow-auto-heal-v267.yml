name: VoiceFlow Auto Heal v267 - FORCE 200
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  heal:
    runs-on: [self-hosted, voiceflow, vps]
    steps:
      - name: Diagnose traefik mounts and config
        run: |
          docker inspect traefik-traefik-1 --format '{{range.Mounts}}{{printf "%s -> %s\n".Source.Destination}}{{end}}'
          ls -la /opt/traefik/ /opt/traefik/dynamic/ /opt/star45/traefik/ 2>&1 | head -n 60
          cat /opt/traefik/traefik.yml 2>/dev/null | head -n 100 || cat /opt/star45/traefik/traefik.yml 2>/dev/null | head -n 100 || cat./traefik/traefik.yml 2>/dev/null | head -n 100 || true
          cat /opt/traefik/dynamic/voiceflow.yml 2>/dev/null || cat /opt/star45/traefik/dynamic/voiceflow.yml 2>/dev/null || true

      - name: Force fix traefik static config
        run: |
          mkdir -p /opt/traefik/dynamic /etc/traefik/dynamic
          # find real static file
          STATIC=$(find /opt -name "traefik.yml" -type f 2>/dev/null | grep -E "traefik.yml$" | head -n1)
          echo "STATIC=$STATIC"
          # ensure file provider
          for f in /opt/traefik/traefik.yml /opt/star45/traefik/traefik.yml /etc/traefik/traefik.yml $STATIC; do
            if [ -f "$f" ]; then
              echo "Patching $f"
              grep -q "file:" "$f" || printf "\nproviders:\n docker:\n exposedByDefault: false\n file:\n directory: /etc/traefik/dynamic\n watch: true\n" >> "$f"
              cat "$f" | tail -n 30
            fi
          done
          # rewrite voiceflow.yml WITHOUT tls to avoid letsencrypt block
          cat > /opt/traefik/dynamic/voiceflow.yml <<'YML'
          http:
            routers:
              voiceflow-http:
                rule: "Host(`voice.star45.net`)"
                entryPoints: ["web"]
                service: voiceflow
              voiceflow-https:
                rule: "Host(`voice.star45.net`)"
                entryPoints: ["websecure"]
                service: voiceflow
                tls:
                  certResolver: letsencrypt
            services:
              voiceflow:
                loadBalancer:
                  servers:
                    - url: "http://172.17.0.1:3005"
          YML
          cp /opt/traefik/dynamic/voiceflow.yml /etc/traefik/dynamic/voiceflow.yml 2>/dev/null || true
          cp /opt/traefik/dynamic/voiceflow.yml /opt/star45/traefik/dynamic/voiceflow.yml 2>/dev/null || true
          chmod 644 /opt/traefik/dynamic/voiceflow.yml
          cat /opt/traefik/dynamic/voiceflow.yml

      - name: Restart traefik and verify internal
        run: |
          docker restart traefik-traefik-1
          sleep 12
          docker logs traefik-traefik-1 --tail 120 | grep -i -E "voiceflow|file|provider|error|ERR|Configuration received" | tail -n 80 || true
          docker exec traefik-traefik-1 wget -qO- http://172.17.0.1:3005/api/health 2>&1 | head -c 200 || docker exec traefik-traefik-1 curl -s http://172.17.0.1:3005/api/health | head -c 200 || echo "inside fail"
          ss -tlnp | grep -E ":80|:443|:3005" || netstat -tlnp | grep -E ":80|:443|:3005" || true

      - name: External check and emergency fallback
        run: |
          echo "=== After traefik restart ==="
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/ first\n" https://voice.star45.net/ || true
          CODE=$(curl -k -s -o /dev/null -w "%{http_code}" https://voice.star45.net/ || echo "000")
          echo "CODE=$CODE"
          if [ "$CODE"!= "200" ]; then
            echo "Still $CODE, activating emergency nginx proxy on 80 directly"
            docker stop traefik-traefik-1 2>/dev/null || true
            docker rm -f voiceflow-emergency-proxy 2>/dev/null || true
            cat > /tmp/nginx-voiceflow.conf <<'NG'
          server {
            listen 80;
            server_name voice.star45.net;
            location / {
              proxy_pass http://172.17.0.1:3005;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
          }
          NG
            docker run -d --name voiceflow-emergency-proxy --network host -v /tmp/nginx-voiceflow.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
            sleep 3
            curl -s -o /dev/null -w "%{http_code} http://127.0.0.1/ after emergency\n" http://127.0.0.1/ || true
            curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/ after emergency\n" https://voice.star45.net/ || true
            # restore traefik later but keep emergency
            docker start traefik-traefik-1 2>/dev/null || true
          fi
          echo "=== Final ==="
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/\n" https://voice.star45.net/ || true
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/app.js\n" https://voice.star45.net/app.js?v=3.5.24 || true
          curl -s http://127.0.0.1:3005/api/health | head -c 200 || true
