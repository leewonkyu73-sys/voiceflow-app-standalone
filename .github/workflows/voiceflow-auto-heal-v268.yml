name: VoiceFlow Auto Heal v268 - KILL HOST TRAEFIK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  heal:
    runs-on: [self-hosted, voiceflow, vps]
    steps:
      - name: Kill host traefik and free 80/443
        run: |
          systemctl stop traefik 2>/dev/null || true
          systemctl disable traefik 2>/dev/null || true
          pkill -9 traefik || true
          killall -9 traefik 2>/dev/null || true
          sleep 2
          ss -tlnp | grep -E ":80|:443" || true
          fuser -k 80/tcp 443/tcp 2>/dev/null || true
          ss -tlnp | grep -E ":80|:443" || true

      - name: Fix dynamic mount correctly
        run: |
          docker inspect traefik-traefik-1 --format '{{json.Mounts}}' | python3 -m json.tool 2>/dev/null || docker inspect traefik-traefik-1 --format '{{range.Mounts}}{{.Source}} -> {{.Destination}} {{end}}'
          # find real dynamic source
          SRC=$(docker inspect traefik-traefik-1 --format '{{range.Mounts}}{{if eq.Destination "/etc/traefik/dynamic"}}{{.Source}}{{end}}{{end}}' 2>/dev/null)
          if [ -z "$SRC" ]; then SRC=$(docker inspect traefik-traefik-1 --format '{{range.Mounts}}{{if eq.Destination "/dynamic"}}{{.Source}}{{end}}{{end}}'); fi
          if [ -z "$SRC" ]; then SRC=/opt/traefik/dynamic; fi
          echo "DYNAMIC_SRC=$SRC"
          mkdir -p $SRC /opt/traefik/dynamic /etc/traefik/dynamic
          cat > $SRC/voiceflow.yml <<'YML'
          http:
            routers:
              voiceflow:
                rule: "Host(`voice.star45.net`)"
                entryPoints: ["web","websecure"]
                service: voiceflow
            services:
              voiceflow:
                loadBalancer:
                  servers:
                    - url: "http://172.17.0.1:3005"
          YML
          cat $SRC/voiceflow.yml
          ls -lh $SRC/
          cp $SRC/voiceflow.yml /opt/traefik/dynamic/voiceflow.yml 2>/dev/null || true
          cp $SRC/voiceflow.yml /etc/traefik/dynamic/voiceflow.yml 2>/dev/null || true
          chmod 644 $SRC/voiceflow.yml /opt/traefik/dynamic/voiceflow.yml 2>/dev/null || true

      - name: Restart docker traefik only
        run: |
          docker restart traefik-traefik-1
          sleep 15
          docker logs traefik-traefik-1 --tail 80 | tail -n 60
          ss -tlnp | grep -E ":80|:443|:3005"
          docker exec traefik-traefik-1 wget -qO- http://172.17.0.1:3005/api/health 2>&1 | head -c 100 || docker exec traefik-traefik-1 curl -s http://172.17.0.1:3005/api/health | head -c 100 || true

      - name: Final verify
        run: |
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/\n" https://voice.star45.net/ || true
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/app.js\n" https://voice.star45.net/app.js?v=3.5.24 || true
          curl -k -s https://voice.star45.net/api/health | head -c 200 || curl -s http://127.0.0.1:3005/api/health | head -c 200 || true
