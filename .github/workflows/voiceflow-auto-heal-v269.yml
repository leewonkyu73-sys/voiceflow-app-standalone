name: VoiceFlow Auto Heal v269 - NGINX FORCE 200
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  heal:
    runs-on: [self-hosted, voiceflow, vps]
    steps:
      - name: Stop all traefik
        run: |
          systemctl stop traefik 2>/dev/null || true
          pkill -9 traefik || true
          docker stop traefik-traefik-1 2>/dev/null || true
          docker stop voiceflow-emergency-proxy 2>/dev/null || true
          docker rm -f voiceflow-emergency-proxy 2>/dev/null || true
          fuser -k 80/tcp 443/tcp 2>/dev/null || true
          sleep 2
          ss -tlnp | grep -E ":80|:443" || echo "80/443 free"

      - name: Create nginx proxy for voice.star45.net -> 3005
        run: |
          mkdir -p /opt/voiceflow-proxy/certs
          cat > /opt/voiceflow-proxy/nginx.conf <<'NG'
          server {
            listen 80;
            listen 443 ssl;
            server_name voice.star45.net;
            ssl_certificate /etc/nginx/certs/self.crt;
            ssl_certificate_key /etc/nginx/certs/self.key;
            location / {
              proxy_pass http://172.17.0.1:3005;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
            }
          }
          NG
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /opt/voiceflow-proxy/certs/self.key -out /opt/voiceflow-proxy/certs/self.crt -subj "/CN=voice.star45.net" 2>/dev/null
          docker rm -f voiceflow-proxy 2>/dev/null || true
          docker run -d --name voiceflow-proxy --network host -v /opt/voiceflow-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro -v /opt/voiceflow-proxy/certs:/etc/nginx/certs:ro nginx:alpine
          sleep 4
          docker ps | grep voiceflow-proxy
          ss -tlnp | grep -E ":80|:443"
          docker logs voiceflow-proxy --tail 30 || true

      - name: Final verify must be 200
        run: |
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/ final\n" https://voice.star45.net/ || true
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/app.js final\n" https://voice.star45.net/app.js?v=3.5.24 || true
          curl -k -s https://voice.star45.net/api/health | head -c 200; echo
          curl -s http://127.0.0.1:3005/api/health | head -c 200; echo
          pm2 list | grep voiceflow || true
