name: VoiceFlow Auto Heal v270 - REAL CERT
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  heal:
    runs-on: [self-hosted, voiceflow, vps]
    steps:
      - name: Use real letsencrypt cert for nginx
        run: |
          ls /opt/traefik/letsencrypt/ /etc/traefik/ 2>/dev/null || true
          cat /opt/traefik/letsencrypt/acme.json 2>/dev/null | head -c 200 || cat /opt/star45/traefik/letsencrypt/acme.json 2>/dev/null | head -c 200 || true
          # find cert files
          find /opt -name "*.crt" -o -name "fullchain.pem" 2>/dev/null | grep star45 | head
          # try reuse traefik certs if exists, else keep self-signed but add http->https redirect off
          docker exec voiceflow-proxy cat /etc/nginx/conf.d/default.conf
          curl -k -s -o /dev/null -w "%{http_code} https://voice.star45.net/ (k)\n" https://voice.star45.net/
          curl -k -s https://voice.star45.net/api/health | head -c 200; echo
