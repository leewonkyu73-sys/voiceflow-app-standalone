<!doctype html>
<html lang="ko" data-v4-mobile="phase2-browser-speech" data-v4-speech="on-device-browser-speech-v1" data-v4-ui="pc-aligned-mobile-v1" data-v4-controls="pc-four-control-mobile-v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>음성메모 · 기본 대화방</title>
  <script data-v4-pwa-boundary="full-shell-v1">
    const entry=new URL(location.href).searchParams.get('entry');
    if(entry!=='browser'&&(navigator.standalone===true||window.matchMedia?.('(display-mode: standalone)').matches===true)){
      location.replace('/?classic=1');
    }
  </script>
  <link rel="stylesheet" href="/v4/mobile/styles.css">
</head>
<body>
  <main class="mobile-shell">
    <header class="app-header">
      <div class="room-title">
        <span class="eyebrow">VOICEFLOW</span>
        <h1>음성메모 · 기본 대화방</h1>
      </div>
      <a class="home-link" href="/?classic=1">홈으로</a>
    </header>

    <section class="room-toolbar" aria-label="회의 제어">
      <div class="language-row" aria-label="언어 설정">
        <label><span>시작</span>
          <select id="sourceLanguage">
            <option value="ko-KR">한국어</option>
            <option value="vi-VN">Tiếng Việt</option>
            <option value="en-US">English</option>
          </select>
        </label>
        <label><span>번역</span>
          <select id="targetLanguage">
            <option value="vi-VN">Tiếng Việt</option>
            <option value="ko-KR">한국어</option>
            <option value="en-US">English</option>
          </select>
        </label>
      </div>

      <section class="media-panel" aria-label="마이크 연결">
        <div class="media-summary">
          <span class="participant-count">참여 1명</span>
          <p id="mediaStatus" data-state="idle">Android Chrome 확인 중 · 오디오는 서버로 보내지 않습니다.</p>
        </div>
        <div class="media-actions">
          <button id="startMicrophone" type="button">마이크 연결</button>
          <button id="stopMicrophone" type="button" disabled>마이크 중지</button>
          <button id="startSpeech" type="button" disabled>음성 원문 시작</button>
          <button id="finishSpeech" type="button" disabled>말하기 완료</button>
        </div>
        <p id="speechStatus" class="speech-status" data-state="idle">Chrome 기기 내 음성팩으로만 원문을 인식합니다.</p>
      </section>
    </section>

    <p id="status" class="status" role="status">회의 연결 확인 중</p>

    <section class="conversation-shell" aria-label="대화 내용">
      <div class="conversation-heading">
        <strong>원문·번역</strong>
        <span>같은 대화방에 바로 저장됩니다.</span>
      </div>
      <section id="captions" class="captions" aria-label="원문과 번역">
        <p class="empty">말을 시작하거나 메시지를 입력하세요.</p>
      </section>
    </section>

    <form id="composer" class="composer">
      <label class="sr-only" for="captionText">원문 입력</label>
      <textarea id="captionText" rows="2" placeholder="말하거나 메시지 입력" required></textarea>
      <button id="sendCaption" type="submit">전송</button>
    </form>
  </main>
  <script type="module" src="/v4/mobile/app.mjs"></script>
</body>
</html>
