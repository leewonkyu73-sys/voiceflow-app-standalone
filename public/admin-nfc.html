<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VoiceFlow NFC·QR 관리</title><link rel="stylesheet" href="/voiceflow-subpage-shell.css"><link rel="stylesheet" href="/admin-nfc.css?v=1.0.0"></head><body><main class="wrap"><header><div><small>관리자 · 장치 연결</small><h1>NFC·QR 관리</h1><p>태그에는 개인정보 대신 임의 ID가 포함된 보안 링크만 기록됩니다.</p></div><div class="header-actions"><a class="button secondary" href="/admin-integrations.html">관리자 설정</a><button id="newTag">새 태그</button></div></header><section class="summary" aria-label="NFC 상태 요약"><article><small>전체 태그</small><b id="totalCount">0</b></article><article><small>활성</small><b id="activeCount">0</b></article><article><small>최근 실행</small><b id="lastUsed">-</b></article></section><section class="card"><div class="section-head"><div><h2>등록된 태그</h2><p>분실 시 즉시 중지할 수 있습니다.</p></div><button class="secondary" id="refresh">새로고침</button></div><div id="tagList" class="tag-list"><p>불러오는 중...</p></div></section><section class="card"><div class="section-head"><div><h2>최근 사용기록</h2><p>개인정보 없이 태그·사용자·결과만 기록합니다.</p></div></div><div id="auditList" class="audit-list"><p>기록이 없습니다.</p></div></section></main><dialog id="editor"><form method="dialog" id="tagForm"><header><div><small>NFC 태그 설정</small><h2 id="editorTitle">새 태그</h2></div><button value="cancel" class="icon secondary" aria-label="닫기">×</button></header><input id="tagId" type="hidden"><label>태그 이름<input id="tagName" required maxlength="80" placeholder="예: 2층 대회의실"></label><label>실행 기능<select id="actionType"><option value="meeting">회의 참가</option><option value="voice_memo">음성메모 시작</option><option value="checkin">출퇴근·현장 확인</option><option value="asset">장비·자산 조회</option><option value="task">업무 열기</option><option value="custom">앱 내부 화면</option></select></label><label>연결 경로<input id="targetPath" required placeholder="/?open=meeting"></label><label>소속 조직<input id="organizationId" maxlength="80" placeholder="전체 조직이면 비워두기"></label><label>설치 위치<input id="locationName" maxlength="120" placeholder="예: 본사 2층 회의실"></label><label class="switch"><input id="tagActive" type="checkbox" checked><span>활성 상태</span></label><p id="formError" class="error" role="alert"></p><footer><button value="cancel" class="secondary">취소</button><button id="saveTag" value="default">저장</button></footer></form></dialog><dialog id="writer"><section><header><div><small>NFC 기록</small><h2 id="writerTitle">태그 기록</h2></div><button id="closeWriter" class="icon secondary">×</button></header><div id="writerUrl" class="url"></div><div class="actions"><button id="writeNfc">NFC에 기록</button><button id="copyUrl" class="secondary">링크 복사</button></div><p id="writerStatus">Android Chrome에서 NFC 태그를 가까이 대세요. 다른 기기는 이 링크를 QR 생성기에 사용할 수 있습니다.</p></section></dialog><script src="/device-nearby-bridge.js?v=1"></script><script src="/admin-nfc.js?v=1.0.0"></script></body></html>
