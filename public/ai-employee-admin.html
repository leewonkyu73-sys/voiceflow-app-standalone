<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceFlow AI Employee Center</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f6f8fb;color:#111827}.wrap{max-width:1180px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(15,23,42,.05)}.employee{padding:14px;border:1px solid #e5e7eb;border-radius:14px;margin:10px 0;cursor:pointer}.employee.active{border-color:#111827;background:#f8fafc}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.label{font-size:12px;color:#64748b;margin-bottom:6px}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe2ea;border-radius:12px;font:inherit}.status{font-size:13px;color:#64748b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,a.btn{border:0;border-radius:12px;padding:12px 16px;background:#111827;color:white;text-decoration:none;font:inherit;cursor:pointer}.secondary{background:#eef2f7!important;color:#111827!important}.danger{background:#fee2e2!important;color:#991b1b!important}.provider{display:inline-flex;gap:6px;align-items:center;padding:6px 9px;border-radius:999px;background:#f1f5f9;margin:3px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#94a3b8}.dot.ok{background:#16a34a}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="head"><div><div class="status">ADMIN · AI EMPLOYEE CENTER</div><h1>AI 직원센터</h1><p class="status">역할·업무·페르소나·모델·검색·스킬·권한·메모리·자율성·주기 실행을 관리합니다.</p><div id="providers"></div></div><div><a class="btn secondary" href="/ai-meeting-lab.html">AI Meeting Lab</a> <a class="btn secondary" href="/">홈</a></div></div><div class="grid"><div class="card"><div class="head"><h2>AI 직원</h2><button id="newEmployee">+ 추가</button></div><div id="employees"><div class="status">불러오는 중...</div></div></div><div class="card"><h2>직원 설정</h2><input id="employeeId" type="hidden"><div class="row"><div class="field"><div class="label">이름</div><input id="displayName"></div><div class="field"><div class="label">직책</div><input id="title"></div></div><div class="row"><div class="field"><div class="label">역할</div><select id="role"><option>strategy</option><option>operations</option><option>finance</option><option>sales</option><option>validator</option><option>advisor</option></select></div><div class="field"><div class="label">모델 Provider</div><select id="provider"><option value="auto">auto</option><option value="openai">OpenAI</option><option value="gemini">Gemini</option><option value="claude">Claude</option></select></div></div><div class="field"><div class="label">모델 ID (비워두면 서버 기본값)</div><input id="modelId" placeholder="server default"></div><div class="field"><div class="label">미션 / 담당업무</div><textarea id="mission" rows="3"></textarea></div><div class="row"><div class="field"><div class="label">대화 톤</div><select id="tone"><option>professional</option><option>concise</option><option>critical</option><option>creative</option></select></div><div class="field"><div class="label">의사결정 스타일</div><select id="decision"><option>evidence_first</option><option>execution_first</option><option>creative</option></select></div></div><div class="row"><div class="field"><div class="label">반론 강도</div><select id="challenge"><option>low</option><option>balanced</option><option>high</option></select></div><div class="field"><div class="label">자율성</div><select id="autonomy"><option>observe</option><option>advise</option><option>execute_with_approval</option><option>execute_within_scope</option></select></div></div><div class="row"><div class="field"><div class="label">검색 정책</div><select id="searchPolicy"><option>off</option><option>internal_only</option><option>web_allowed</option></select></div><div class="field"><div class="label">메모리 정책</div><select id="memoryPolicy"><option>meeting_summary</option><option>approved_learning</option><option>long_term</option></select></div></div><div class="field"><div class="label">전문분야 (쉼표 구분)</div><input id="expertise"></div><div class="field"><div class="label">스킬 (쉼표 구분)</div><input id="skills"></div><div class="field"><div class="label">도구 권한 (쉼표 구분)</div><input id="tools" placeholder="tasks.read, tasks.propose"></div><div class="row"><div class="field"><div class="label">일일 비용한도 USD</div><input id="costLimit" type="number" min="0" step="0.1" value="5"></div><div class="field"><div class="label">상태</div><select id="status"><option value="active">active</option><option value="paused">paused</option><option value="disabled">disabled</option></select></div></div><div class="actions"><button id="save">저장</button><button id="test" class="secondary">테스트 대화</button><button id="toggle" class="secondary">일시중지/활성</button><button id="disable" class="danger">비활성화</button></div><div id="testResult" class="status" style="margin-top:14px"></div></div></div></div><script src="/ai-employee-admin.js"></script><script src="/ai-employee-scheduler.js?v=2.8.2"></script></body></html>
