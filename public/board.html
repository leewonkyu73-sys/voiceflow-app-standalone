<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceFlow 공지 · 자료실</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f8fb;color:#111827}.wrap{max-width:1100px;margin:auto;padding:24px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs,.actions,.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,input,select,textarea{font:inherit}button{border:1px solid #dbe2ea;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}.active,.primary{background:#111827;color:#fff}.danger{color:#b91c1c}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-bottom:12px}.post{display:grid;grid-template-columns:90px 1fr 150px;gap:14px;align-items:center}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;width:max-content}.muted{color:#64748b;font-size:13px}.empty{text-align:center;color:#64748b;padding:50px}.search{width:100%;box-sizing:border-box;border:1px solid #dbe2ea;border-radius:12px;padding:12px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:grid;place-items:center;padding:20px}.modal[hidden]{display:none}.dialog{width:min(680px,100%);background:#fff;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}.dialog label{display:block;margin:12px 0}.dialog input,.dialog select,.dialog textarea{width:100%;box-sizing:border-box;border:1px solid #dbe2ea;border-radius:10px;padding:10px}.check{display:flex!important;gap:8px;align-items:center}.check input{width:auto}.files{font-size:13px;color:#475569;margin-top:6px}.post-actions{display:flex;gap:6px;justify-content:flex-end}.post-actions button{padding:7px 9px}.detail{white-space:pre-wrap;margin-top:10px;color:#334155}.hidden{display:none}@media(max-width:700px){.post{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.post-actions{justify-content:flex-start}}</style><link rel="stylesheet" href="/voiceflow-subpage-shell.css?v=3.1.9"></head><body><div class="wrap"><div class="top"><div><strong>VoiceFlow</strong><h1>자료실</h1><div class="muted">음성메모·회의록·참조자료를 개인/업무 범위와 공개 권한에 따라 관리합니다.</div></div><div class="actions"><a href="/"><button>홈</button></a><button class="primary" id="write">글쓰기</button></div></div><div class="tabs"><button class="active" data-category="voice-memo">음성메모</button><button data-category="minutes">회의록</button><button data-category="reference">참조자료</button></div><div class="tabs"><button class="active" data-scope="">전체</button><button data-scope="personal">개인</button><button data-scope="work">업무</button></div><input class="search" id="search" placeholder="제목, 내용, 태그 검색"><div id="status" class="muted" style="margin:10px 0"></div><div id="list"><div class="empty">불러오는 중...</div></div></div><div class="modal" id="modal" hidden><div class="dialog"><div class="row"><h2 id="formTitle">게시물 작성</h2><button id="close">닫기</button></div><input id="postId" type="hidden"><input id="boardType" type="hidden" value="library"><label>자료 종류<select id="category"><option value="voice-memo">음성메모</option><option value="minutes">회의록</option><option value="reference">참조자료</option></select></label><label>구분<select id="scope"><option value="personal">개인</option><option value="work">업무</option></select></label><label>제목<input id="title" maxlength="160" placeholder="제목"></label><label>내용<textarea id="body" rows="8" placeholder="내용"></textarea></label><label>태그<input id="tags" placeholder="예: 회의, 교육, 베트남"></label><label>첨부 메타데이터<input id="attachments" placeholder="파일명 또는 URL을 쉼표로 구분"></label><div class="muted">현재 단계에서는 파일 자체 업로드 대신 파일명/URL 메타데이터를 저장합니다. 실제 파일 업로드는 Storage Connector 단계에서 연결합니다.</div><label>공개범위<select id="visibility"><option value="private">나만 보기</option><option value="staff">직원 공개</option><option value="shared">지정 공유</option></select></label><label>지정 공유 직원 ID<input id="sharedWith" placeholder="직원 ID를 쉼표로 구분"></label><div class="muted">일시 참여자는 자료실에 접근할 수 없습니다. 호스트가 지정 공유한 링크만 열 수 있습니다.</div><label class="check"><input id="pinned" type="checkbox"><span>상단 고정</span></label><div class="form-actions"><button class="primary" id="save">저장</button><button id="cancel">취소</button></div></div></div><script>const S={type:'library',category:'voice-memo',scope:'',items:[],user:null};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));async function me(){try{const r=await fetch('/api/v1/auth/me',{credentials:'same-origin'});const d=await r.json();S.user=d.user||null}catch{S.user=null}}function fileMeta(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>({name:x,url:/^https?:\/\//.test(x)?x:''}))}function render(){const q=$('#search').value.trim().toLowerCase();const items=S.items.filter(x=>!q||[x.title,x.body,(x.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));$('#list').innerHTML=items.length?items.map(x=>`<article class="card"><div class="post"><div><span class="badge">${x.pinned?'고정':'게시'}</span></div><div><b>${esc(x.title)}</b><div class="muted">${esc(x.author_name||'Member')} · ${esc((x.created_at||'').slice(0,16).replace('T',' '))} · ${esc(x.scope==='personal'?'개인':'업무')} · ${esc(x.visibility==='private'?'나만':x.visibility==='shared'?'지정공유':'직원공개')}</div><div class="files">첨부 ${(x.attachments||[]).length} · 태그 ${(x.tags||[]).map(esc).join(', ')||'-'}</div></div><div class="post-actions"><button data-view="${x.post_id}">보기</button><button data-edit="${x.post_id}">수정</button><button class="danger" data-del="${x.post_id}">삭제</button></div></div><div id="detail-${x.post_id}" class="detail hidden">${esc(x.body||'')}</div></article>`).join(''):'<div class="empty">등록된 글이 없습니다.</div>';bindRows()}async function load(){try{$('#status').textContent='게시물을 불러오는 중...';const r=await fetch('/api/v1/board/posts?type=library&category='+encodeURIComponent(S.category)+'&scope='+encodeURIComponent(S.scope),{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw new Error(d.error||'board_api_error');S.items=d.data||[];$('#status').textContent=`${S.items.length}개 게시물`;render()}catch(e){S.items=[];$('#status').textContent='게시판 API가 아직 운영 경로에 연결되지 않았습니다.';render()}}function openForm(row=null){$('#postId').value=row?.post_id||'';$('#boardType').value='library';$('#category').value=row?.category||S.category;$('#scope').value=row?.scope||'personal';$('#title').value=row?.title||'';$('#body').value=row?.body||'';$('#tags').value=(row?.tags||[]).join(', ');$('#attachments').value=(row?.attachments||[]).map(a=>a.url||a.name||'').join(', ');$('#visibility').value=row?.visibility||'private';$('#sharedWith').value=(row?.shared_with||[]).join(', ');$('#pinned').checked=!!row?.pinned;$('#formTitle').textContent=row?'게시물 수정':'게시물 작성';$('#modal').hidden=false}function closeForm(){$('#modal').hidden=true}async function save(){const id=$('#postId').value;const payload={board_type:'library',category:$('#category').value,scope:$('#scope').value,title:$('#title').value.trim(),body:$('#body').value,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),attachments:fileMeta($('#attachments').value),visibility:$('#visibility').value,shared_with:$('#sharedWith').value.split(',').map(x=>x.trim()).filter(Boolean),pinned:$('#pinned').checked,author_id:S.user?.id||'',author_name:S.user?.name||'Member'};if(!payload.title)return alert('제목을 입력해주세요.');const url=id?'/api/v1/board/posts/'+encodeURIComponent(id):'/api/v1/board/posts';const r=await fetch(url,{method:id?'PATCH':'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)return alert('저장 실패: '+(d.error||r.status));closeForm();S.category=payload.category;S.scope=payload.scope;$('[data-category]').forEach(x=>x.classList.toggle('active',x.dataset.category===S.category));$('[data-scope]').forEach(x=>x.classList.toggle('active',x.dataset.scope===S.scope));await load()}async function remove(id){if(!confirm('이 게시물을 삭제하시겠습니까?'))return;const r=await fetch('/api/v1/board/posts/'+encodeURIComponent(id),{method:'DELETE',credentials:'same-origin'});if(!r.ok)return alert('삭제에 실패했습니다.');await load()}function bindRows(){$$('[data-view]').forEach(b=>b.onclick=()=>$('#detail-'+b.dataset.view)?.classList.toggle('hidden'));$$('[data-edit]').forEach(b=>b.onclick=()=>openForm(S.items.find(x=>x.post_id===b.dataset.edit)));$$('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del))}$('[data-category]').forEach(b=>b.onclick=()=>{$('[data-category]').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.category=b.dataset.category;load()});$('[data-scope]').forEach(b=>b.onclick=()=>{$('[data-scope]').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.scope=b.dataset.scope;load()});$('#search').oninput=render;$('#write').onclick=()=>openForm();$('#close').onclick=closeForm;$('#cancel').onclick=closeForm;$('#save').onclick=save;(async()=>{await me();await load()})()</script><script src="/voiceflow-subpage-shell.js?v=3.1.9"></script></body></html>
