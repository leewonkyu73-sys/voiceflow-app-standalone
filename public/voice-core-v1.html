<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VoiceFlow 안정화 음성 코어</title>
  <link rel="stylesheet" href="/voice-core-v1.css?v=1">
</head>
<body>
  <main class="core">
    <header>
      <div><small>ISOLATED VOICE CORE</small><h1>음성·번역 안정화 테스트</h1></div>
      <a href="/">기존 앱</a>
    </header>
    <section class="settings">
      <label>말하기 언어
        <select id="sourceLanguage">
          <option value="ko-KR">한국어</option><option value="vi-VN">Tiếng Việt</option>
          <option value="en-US">English</option><option value="zh-CN">中文</option>
        </select>
      </label>
      <label>번역 언어
        <select id="targetLanguage">
          <option value="vi-VN">Tiếng Việt</option><option value="ko-KR">한국어</option>
          <option value="en-US">English</option><option value="zh-CN">中文</option>
        </select>
      </label>
    </section>
    <section class="controls">
      <button id="startVoice" class="primary">마이크 시작</button>
      <button id="stopVoice" disabled>중지</button>
      <span id="coreStatus" role="status">준비</span>
    </section>
    <section class="meter" aria-label="마이크 입력 크기"><i id="meterBar"></i></section>
    <p class="notice">마이크 1개와 서버 음성인식 1개만 사용합니다. 음성 명령과 화상 기능은 이 테스트에서 분리했습니다.</p>
    <section id="messages" class="messages" aria-live="polite">
      <div class="empty">말하거나 아래 입력창에 문장을 입력하세요.</div>
    </section>
    <form id="chatForm" class="composer">
      <textarea id="chatText" rows="2" placeholder="번역할 문장을 직접 입력"></textarea>
      <button class="primary">전송·번역</button>
    </form>
  </main>
  <script type="module" src="/voice-core-v1.js?v=1"></script>
</body>
</html>
