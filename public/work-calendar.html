<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceFlow 업무 캘린더</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f8fb;color:#111827}.wrap{max-width:1220px;margin:auto;padding:24px}.top,.head,.toolbar,.filters,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top,.head{justify-content:space-between}.brand{font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{font:inherit}button{border:1px solid #dbe2ea;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}button.active,.primary{background:#111827;color:#fff;border-color:#111827}.danger{color:#b91c1c}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 8px 30px rgba(15,23,42,.04)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:125px;border:1px solid #e5e7eb;border-radius:14px;padding:10px;background:#fff}.day.today{outline:2px solid #111827}.date{font-weight:700;font-size:13px;margin-bottom:8px}.task{padding:8px;border-radius:10px;background:#f1f5f9;margin:6px 0;font-size:12px;cursor:pointer}.task.high,.task.urgent{border-left:4px solid #111827}.task.done{text-decoration:line-through;opacity:.55}.task small{display:block;color:#64748b;margin-top:3px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.week .col{min-height:330px}.list{display:grid;gap:8px}.list .task{font-size:14px;padding:12px}.empty{color:#64748b;padding:32px;text-align:center}.dayview{display:grid;gap:10px}.dayrow{display:grid;grid-template-columns:80px 1fr;gap:12px;border-bottom:1px solid #eef2f7;padding:10px 0}.filters{margin:14px 0}.filters select,.filters input,.modal input,.modal select,.modal textarea{border:1px solid #dbe2ea;border-radius:10px;padding:10px;background:#fff}.sync{font-size:12px;color:#64748b}.modal-bg{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-bg.show{display:flex}.modal{background:#fff;border-radius:20px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal label{display:grid;gap:6px;margin-bottom:12px}.modal textarea{min-height:100px}.progress{display:flex;gap:8px;align-items:center}.progress input{flex:1}.statusbar{display:flex;justify-content:space-between;gap:12px;margin:10px 0 18px;color:#64748b;font-size:13px}@media(max-width:800px){.grid,.week,.form-grid{grid-template-columns:1fr}.day{min-height:auto}.top{align-items:flex-start;flex-direction:column}}</style><link rel="stylesheet" href="/voiceflow-subpage-shell.css?v=3.1.9"></head><body><div class="wrap"><div class="top"><div><div class="brand">VoiceFlow · 업무방</div><h1>업무 캘린더</h1></div><div class="tabs"><button data-view="day">일간</button><button data-view="week">주간</button><button data-view="month" class="active">월간</button><button data-view="list">목록</button><a href="/"><button>홈</button></a></div></div><div class="card"><div class="head"><div class="toolbar"><button id="prev">‹</button><button id="today">오늘</button><button id="next">›</button><strong id="range"></strong></div><div class="actions"><button id="newTask" class="primary">+ 새 업무</button><button id="reload">새로고침</button></div></div><div class="filters"><input id="search" placeholder="업무 검색"><select id="ownerFilter"><option value="">담당자 전체</option></select><select id="statusFilter"><option value="">상태 전체</option><option value="todo">예정</option><option value="doing">진행</option><option value="done">완료</option><option value="hold">보류</option></select><select id="scopeFilter"><option value="">범위 전체</option><option value="personal">개인</option><option value="department">부서</option><option value="company">회사</option></select></div><div class="statusbar"><span id="count">0건</span><span id="sync" class="sync">Google / Outlook 연결상태 확인 중</span></div><div id="content" class="empty">업무를 불러오는 중입니다.</div></div></div><div class="modal-bg" id="modal"><div class="modal"><div class="head"><h2 id="modalTitle">업무</h2><button id="closeModal">닫기</button></div><label>업무명<input id="fTitle"></label><label>설명<textarea id="fDescription"></textarea></label><div class="form-grid"><label>담당자<input id="fOwner"></label><label>부서<input id="fDepartment"></label><label>마감일<input id="fDeadline" type="date"></label><label>시간<input id="fTime" type="time"></label><label>우선순위<select id="fPriority"><option value="low">낮음</option><option value="normal">보통</option><option value="high">높음</option><option value="urgent">긴급</option></select></label><label>상태<select id="fStatus"><option value="todo">예정</option><option value="doing">진행</option><option value="done">완료</option><option value="hold">보류</option></select></label><label>업무 범위<select id="fScope"><option value="personal">개인</option><option value="department">부서</option><option value="company">회사</option></select></label><label>완료율<div class="progress"><input id="fProgress" type="range" min="0" max="100" value="0"><b id="progressText">0%</b></div></label></div><div class="actions"><button id="saveTask" class="primary">저장</button><button id="deleteTask" class="danger">삭제</button></div></div></div><script>const S={view:'month',date:new Date(),tasks:[],edit:null};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const pad=n=>String(n).padStart(2,'0');const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function taskDate(t){const raw=t.deadline||t.due_date||t.date||t.created_at;const d=raw?new Date(raw):null;return d&&!isNaN(d)?ymd(d):''}async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'request_failed');return d}function filtered(){const q=$('#search').value.trim().toLowerCase(),owner=$('#ownerFilter').value,status=$('#statusFilter').value,scope=$('#scopeFilter').value;return S.tasks.filter(t=>(!q||(t.title||'').toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q))&&(!owner||t.owner===owner)&&(!status||t.status===status)&&(!scope||t.scope===scope))}async function load(){try{const d=await api('/api/v1/tasks');S.tasks=d.data||[]}catch(e){S.tasks=[];$('#sync').textContent='업무 API 연결 필요: '+e.message}refreshOwners();await loadSync();render()}async function loadSync(){try{const d=await api('/api/v1/tasks/sync/status');const x=d.data||{};$('#sync').textContent='Google '+(x.google?.configured?'연결됨':'미연결')+' · Outlook '+(x.outlook?.configured?'연결됨':'미연결')}catch{if(!$('#sync').textContent.includes('업무 API'))$('#sync').textContent='Google / Outlook 동기화 준비'}}function refreshOwners(){const cur=$('#ownerFilter').value;const owners=[...new Set(S.tasks.map(x=>x.owner).filter(Boolean))].sort();$('#ownerFilter').innerHTML='<option value="">담당자 전체</option>'+owners.map(x=>'<option '+(x===cur?'selected':'')+'>'+esc(x)+'</option>').join('')}function items(date){const k=ymd(date);return filtered().filter(t=>taskDate(t)===k)}function taskHtml(t){return '<div class="task '+esc(t.status||'todo')+' '+esc(t.priority||'normal')+'" data-task="'+esc(t.id)+'"><b>'+esc(t.title||'업무')+'</b><small>'+esc(t.owner||'미지정')+' · '+esc(t.status||'todo')+' · '+Number(t.progress||0)+'%</small></div>'}function month(){const y=S.date.getFullYear(),m=S.date.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push('<div class="day '+(ymd(d)===ymd(new Date())?'today':'')+'"><div class="date">'+d.getDate()+'</div>'+items(d).slice(0,5).map(taskHtml).join('')+'</div>')}$('#range').textContent=y+'년 '+(m+1)+'월';$('#content').className='grid';$('#content').innerHTML=cells.join('')}function week(){const d=new Date(S.date),sun=new Date(d);sun.setDate(d.getDate()-d.getDay());let h='';for(let i=0;i<7;i++){const x=new Date(sun);x.setDate(sun.getDate()+i);h+='<div class="card col"><div class="date">'+(x.getMonth()+1)+'/'+x.getDate()+'</div>'+items(x).map(taskHtml).join('')+'</div>'}$('#range').textContent=ymd(sun)+' ~ '+ymd(new Date(sun.getFullYear(),sun.getMonth(),sun.getDate()+6));$('#content').className='week';$('#content').innerHTML=h}function day(){const its=items(S.date);$('#range').textContent=ymd(S.date);$('#content').className='dayview';$('#content').innerHTML=its.length?its.map(t=>'<div class="dayrow"><div>'+esc(t.time||'종일')+'</div><div>'+taskHtml(t)+'</div></div>').join(''):'<div class="empty">이 날짜의 업무가 없습니다.</div>'}function list(){const arr=filtered().sort((a,b)=>String(taskDate(a)).localeCompare(String(taskDate(b))));$('#range').textContent='전체 업무';$('#content').className='list';$('#content').innerHTML=arr.length?arr.map(t=>taskHtml(t)+'<small>'+esc(taskDate(t))+'</small>').join(''):'<div class="empty">등록된 업무가 없습니다.</div>'}function bindTasks(){$$('[data-task]').forEach(x=>x.onclick=()=>openTask(x.dataset.task))}function render(){$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));$('#count').textContent=filtered().length+'건';({month,week,day,list}[S.view]||month)();bindTasks()}function openTask(id){S.edit=S.tasks.find(x=>x.id===id)||null;const t=S.edit||{title:'',description:'',owner:'',department:'',deadline:ymd(S.date),time:'',priority:'normal',status:'todo',scope:'personal',progress:0};$('#modalTitle').textContent=S.edit?'업무 수정':'새 업무';$('#fTitle').value=t.title||'';$('#fDescription').value=t.description||'';$('#fOwner').value=t.owner||'';$('#fDepartment').value=t.department||'';$('#fDeadline').value=(t.deadline||'').slice(0,10);$('#fTime').value=t.time||'';$('#fPriority').value=t.priority||'normal';$('#fStatus').value=t.status||'todo';$('#fScope').value=t.scope||'personal';$('#fProgress').value=Number(t.progress||0);$('#progressText').textContent=Number(t.progress||0)+'%';$('#deleteTask').style.display=S.edit?'inline-block':'none';$('#modal').classList.add('show')}function payload(){return{title:$('#fTitle').value,description:$('#fDescription').value,owner:$('#fOwner').value,department:$('#fDepartment').value,deadline:$('#fDeadline').value,time:$('#fTime').value,priority:$('#fPriority').value,status:$('#fStatus').value,scope:$('#fScope').value,progress:Number($('#fProgress').value)}}async function save(){if(!$('#fTitle').value.trim())return alert('업무명을 입력하세요.');try{if(S.edit)await api('/api/v1/tasks/'+S.edit.id,{method:'PATCH',body:JSON.stringify(payload())});else await api('/api/v1/tasks',{method:'POST',body:JSON.stringify(payload())});$('#modal').classList.remove('show');await load()}catch(e){alert('저장 실패: '+e.message)}}async function del(){if(!S.edit||!confirm('이 업무를 삭제하시겠습니까?'))return;try{await api('/api/v1/tasks/'+S.edit.id,{method:'DELETE'});$('#modal').classList.remove('show');await load()}catch(e){alert('삭제 실패: '+e.message)}}$$('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()});$('#prev').onclick=()=>{if(S.view==='month')S.date.setMonth(S.date.getMonth()-1);else if(S.view==='week')S.date.setDate(S.date.getDate()-7);else S.date.setDate(S.date.getDate()-1);render()};$('#next').onclick=()=>{if(S.view==='month')S.date.setMonth(S.date.getMonth()+1);else if(S.view==='week')S.date.setDate(S.date.getDate()+7);else S.date.setDate(S.date.getDate()+1);render()};$('#today').onclick=()=>{S.date=new Date();render()};$('#reload').onclick=load;$('#newTask').onclick=()=>{S.edit=null;openTask(null)};$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#saveTask').onclick=save;$('#deleteTask').onclick=del;$('#fProgress').oninput=e=>$('#progressText').textContent=e.target.value+'%';['search','ownerFilter','statusFilter','scopeFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));load();</script><script src="/voiceflow-subpage-shell.js?v=3.1.9"></script></body></html>
